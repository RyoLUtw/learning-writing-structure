<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Museum Search Challenge</title>
  <style>
    :root {
      --bg1: #f1f5f9;
      --bg2: #e2e8f0;
      --card: #ffffff;
      --muted: #f8fafc;
      --line: #cbd5e1;
      --wall: #334155;
      --text: #0f172a;
      --subtext: #64748b;
      --corridor: #cbd5e1;
      --corridor-dark: #94a3b8;
      --accent: #0f172a;
      --accent-text: #ffffff;
      --badge: #e2e8f0;
      --success: #16a34a;
      --highlight: #fef08a;
      --shadow: 0 10px 30px rgba(15, 23, 42, 0.08);
      --shadow-strong: 0 10px 24px rgba(15, 23, 42, 0.08);
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    html, body { margin: 0; padding: 0; }
    body {
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--text);
      background: linear-gradient(to bottom, var(--bg1), var(--bg2));
      min-height: 100vh;
      padding: 16px;
    }
    .app-stack { max-width: 1280px; margin: 0 auto; display: grid; gap: 24px; }
    .app-shell { display: grid; gap: 24px; grid-template-columns: 320px 1fr; }
    .panel, .section-card {
      background: rgba(255,255,255,0.96);
      border-radius: 28px;
      box-shadow: 0 18px 40px rgba(15,23,42,0.12);
      overflow: hidden;
    }
    .panel-header, .section-pad { padding: 24px 24px 0; }
    .panel-body, .section-body { padding: 24px; }
    .title { font-size: 1.5rem; font-weight: 700; margin: 0; }
    .subtitle { color: var(--subtext); margin-top: 8px; line-height: 1.5; }
    .info-box, .prompt-box {
      background: var(--muted);
      border-radius: 18px;
      padding: 16px;
      margin-bottom: 20px;
      border: 1px solid #e2e8f0;
    }
    .info-label, .label-row { display: flex; align-items: center; gap: 8px; font-size: 0.9rem; font-weight: 600; color: #334155; margin-bottom: 12px; }
    .badge-list, .pill-row, .star-row, .option-list { display: flex; flex-wrap: wrap; gap: 8px; }
    .badge, .pill {
      display: inline-flex; align-items: center; justify-content: center;
      padding: 6px 10px; border-radius: 999px; background: var(--badge); color: #334155; font-size: 0.8rem; font-weight: 600;
    }
    .badge.found, .badge.dark, .pill.active { background: var(--accent); color: white; }
    .badge.done { background: #dcfce7; color: #166534; }
    .progress-bar { width: 100%; height: 10px; background: #e2e8f0; border-radius: 999px; overflow: hidden; }
    .progress-fill { height: 100%; background: var(--accent); width: 0%; transition: width 0.2s ease; }
    .progress-meta { display: flex; justify-content: space-between; font-size: 0.9rem; color: #475569; margin-bottom: 10px; gap: 12px; }
    .timer-value { font-size: 1.15rem; font-weight: 700; font-variant-numeric: tabular-nums; }
    .button-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    button { font: inherit; cursor: pointer; border: none; }
    .btn, .choice-btn, .star-btn, .pill-btn {
      border-radius: 18px; padding: 12px 16px; font-weight: 600; transition: transform 0.12s ease, background 0.12s ease, border-color 0.12s ease;
    }
    .btn:hover, .choice-btn:hover, .star-btn:hover, .pill-btn:hover { transform: translateY(-1px); }
    .btn-primary { background: var(--accent); color: white; }
    .btn-secondary, .choice-btn, .star-btn, .pill-btn { background: white; color: #334155; border: 1px solid var(--line); }
    .choice-btn.active, .star-btn.active, .pill-btn.active { background: var(--accent); color: white; border-color: var(--accent); }
    .main-panel-header { padding: 20px 24px; border-bottom: 1px solid #e2e8f0; background: rgba(255,255,255,0.85); }
    .header-top, .summary-grid { display: flex; justify-content: space-between; align-items: center; gap: 16px; flex-wrap: wrap; margin-bottom: 16px; }
    .museum-tabs, .view-badges, .top-actions { display: flex; gap: 8px; flex-wrap: wrap; }
    .pill-btn { border-radius: 999px; padding: 9px 16px; font-size: 0.9rem; font-weight: 700; }
    .pill-btn:disabled, .btn:disabled { opacity: 0.45; cursor: default; transform: none; }
    .map-wrapper { padding: 20px 24px 24px; }
    .blueprint {
      position: relative; overflow: hidden; border-radius: 32px; border: 4px solid var(--wall); background: var(--bg1); padding: 16px 16px 20px;
      box-shadow: inset 0 2px 10px rgba(15,23,42,0.08);
    }
    .blueprint::before {
      content: ""; position: absolute; inset: 0; pointer-events: none;
      background: radial-gradient(circle at top left, rgba(255,255,255,0.7), transparent 35%), linear-gradient(to right, rgba(148,163,184,0.12) 1px, transparent 1px), linear-gradient(to bottom, rgba(148,163,184,0.12) 1px, transparent 1px);
      background-size: auto, 28px 28px, 28px 28px;
    }
    .blueprint.simple-grid::before { background: linear-gradient(to right, rgba(148,163,184,0.1) 1px, transparent 1px), linear-gradient(to bottom, rgba(148,163,184,0.1) 1px, transparent 1px); background-size: 24px 24px, 24px 24px; }
    .blueprint > * { position: relative; }
    .lobby, .section-header-box { position: relative; margin-bottom: 20px; border-radius: 32px; border: 4px solid var(--wall); background: white; padding: 20px; text-align: center; box-shadow: 0 4px 12px rgba(15,23,42,0.05); }
    .lobby::after {
      content: ""; position: absolute; left: 50%; top: 100%; transform: translateX(-50%); width: 24px; height: 40px; background: var(--corridor); border-left: 4px solid var(--wall); border-right: 4px solid var(--wall);
    }
    .micro-label { font-size: 10px; text-transform: uppercase; letter-spacing: 0.35em; color: var(--subtext); }
    .section-title { margin-top: 8px; font-size: 1.25rem; font-weight: 700; }
    .subtitle-text { margin-top: 8px; font-size: 0.92rem; color: var(--subtext); }
    .two-wing { display: grid; gap: 16px; grid-template-columns: 1fr 88px 1fr; align-items: stretch; }
    .wing { display: grid; gap: 16px; }
    .corridor-vertical { display: flex; flex-direction: column; align-items: center; justify-content: space-between; border-radius: 32px; border: 4px solid var(--wall); background: var(--corridor-dark); padding: 16px 12px; text-align: center; }
    .vertical-text { writing-mode: vertical-rl; transform: rotate(180deg); text-transform: uppercase; letter-spacing: 0.2em; font-size: 0.9rem; font-weight: 700; color: #1e293b; }
    .connector-row-left, .connector-row-right { display: grid; align-items: center; gap: 0; }
    .connector-row-left { grid-template-columns: 1fr 52px; }
    .connector-row-right { grid-template-columns: 52px 1fr; }
    .connector-left, .connector-right { height: 20px; background: var(--corridor); }
    .connector-left { border-top: 4px solid var(--wall); border-bottom: 4px solid var(--wall); border-left: 4px solid var(--wall); border-top-left-radius: 999px; border-bottom-left-radius: 999px; }
    .connector-right { border-top: 4px solid var(--wall); border-bottom: 4px solid var(--wall); border-right: 4px solid var(--wall); border-top-right-radius: 999px; border-bottom-right-radius: 999px; }
    .floor-room {
      position: relative; width: 100%; min-height: 150px; border: 4px solid var(--wall); background: rgba(255,255,255,0.96); text-align: left; padding: 16px; box-shadow: var(--shadow);
    }
    .floor-room:hover { background: white; transform: scale(1.015); }
    .room-outline { position: absolute; inset: 8px; border: 1px dashed #cbd5e1; border-radius: 20px; pointer-events: none; }
    .door-right, .door-left { position: absolute; background: var(--bg1); top: 50%; transform: translateY(-50%); width: 12px; height: 64px; }
    .door-right { right: -2px; border-top: 4px solid var(--wall); border-bottom: 4px solid var(--wall); border-left: 4px solid var(--wall); border-top-left-radius: 999px; border-bottom-left-radius: 999px; }
    .door-left { left: -2px; border-top: 4px solid var(--wall); border-bottom: 4px solid var(--wall); border-right: 4px solid var(--wall); border-top-right-radius: 999px; border-bottom-right-radius: 999px; }
    .room-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; position: relative; z-index: 1; }
    .room-kicker { font-size: 10px; text-transform: uppercase; letter-spacing: 0.28em; color: var(--subtext); }
    .room-title { margin-top: 8px; font-size: 1rem; font-weight: 700; line-height: 1.35; word-break: break-word; }
    .room-meta { margin-top: 10px; font-size: 0.9rem; color: #475569; position: relative; z-index: 1; }
    .room-icon { font-size: 1.1rem; opacity: 0.75; }
    .shape-1 { border-top-left-radius: 48px; border-bottom-right-radius: 32px; border-top-right-radius: 20px; border-bottom-left-radius: 20px; }
    .shape-2 { border-top-left-radius: 28px; border-top-right-radius: 36px; border-bottom-left-radius: 32px; border-bottom-right-radius: 20px; }
    .shape-3 { border-top-right-radius: 48px; border-bottom-left-radius: 32px; border-top-left-radius: 20px; border-bottom-right-radius: 20px; }
    .shape-4 { border-bottom-left-radius: 48px; border-top-right-radius: 32px; border-top-left-radius: 20px; border-bottom-right-radius: 20px; }
    .shape-5 { border-radius: 28px; min-height: 96px; }
    .shape-6 { border-bottom-right-radius: 48px; border-top-left-radius: 32px; border-top-right-radius: 20px; border-bottom-left-radius: 20px; }
    .item-room.highlighted { background: var(--highlight); border-color: #ca8a04; box-shadow: 0 0 0 4px rgba(250,204,21,0.35); }
    .summary-grid { align-items: stretch; }
    .summary-card { flex: 1; min-width: 180px; border-radius: 18px; border: 1px solid var(--line); padding: 16px; background: #fff; }
    .summary-card strong { display: block; font-size: 1.2rem; margin-top: 6px; }
    .option-card, .drop-zone, .drag-card { border: 1px solid var(--line); border-radius: 16px; padding: 14px; background: white; }
    .option-card.correct { border-color: var(--success); background: #f0fdf4; }
    .option-card.incorrect { border-color: #ef4444; background: #fef2f2; }
    .drop-grid { display: grid; gap: 14px; grid-template-columns: repeat(3, 1fr); }
    .drop-zone.drag-over { border-color: var(--accent); background: #f8fafc; }
    .drop-zone h4 { margin: 0 0 8px; }
    .drag-bank { display: grid; gap: 10px; }
    .drag-card { cursor: grab; }
    .drag-card.placed { background: #e2e8f0; }
    .feedback { margin-top: 12px; font-weight: 600; }
    .modal-backdrop {
      position: fixed; inset: 0; background: rgba(15,23,42,0.55); display: flex; align-items: center; justify-content: center; padding: 20px; z-index: 1000;
    }
    .modal { max-width: 520px; width: 100%; background: white; border-radius: 28px; padding: 24px; box-shadow: 0 24px 60px rgba(15,23,42,0.25); }
    .modal h3 { margin-top: 0; font-size: 1.4rem; }
    .hidden { display: none; }
    @media (max-width: 1100px) {
      .app-shell, .drop-grid { grid-template-columns: 1fr; }
      .two-wing { grid-template-columns: 1fr; }
      .corridor-vertical, .connector-left, .connector-right { display: none; }
      .connector-row-left, .connector-row-right { grid-template-columns: 1fr; }
    }
    @media (max-width: 700px) {
      body { padding: 12px; }
      .button-row { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div id="app"></div>
  <script>
    const CATEGORY_ITEMS = {
      Kitchen: ["plate", "bowl", "cup", "fork", "spoon", "knife", "pan", "pot", "kettle", "cutting board", "dish soap", "sponge"],
      Bedroom: ["pillow", "blanket", "hanger", "alarm clock", "lamp", "laundry basket", "bedsheet", "slippers", "mirror"],
      Bathroom: ["toothbrush", "toothpaste", "towel", "soap", "shampoo", "hair dryer", "toilet paper", "comb", "razor"],
      Cleaning: ["broom", "mop", "bucket", "vacuum cleaner", "spray bottle", "dustpan", "rubber gloves", "trash bag"],
      LivingRoom: ["remote control", "cushion", "candle", "vase", "extension cord", "battery", "flashlight", "tissue box"],
      Study: ["pen", "pencil", "eraser", "ruler", "scissors", "tape", "notebook", "marker"]
    };

    const SHOWROOM_SECTIONS = {
      Kitchen: { Cookware: ["pan", "pot", "kettle", "cutting board"], Tableware: ["plate", "bowl", "cup", "fork", "spoon", "knife"], Cleaning: ["dish soap", "sponge"] },
      Bedroom: { Bedding: ["pillow", "blanket", "bedsheet"], Storage: ["hanger", "laundry basket", "slippers"], Personal: ["alarm clock", "lamp", "mirror"] },
      Bathroom: { DentalCare: ["toothbrush", "toothpaste"], Bathing: ["towel", "soap", "shampoo"], Grooming: ["hair dryer", "toilet paper", "comb", "razor"] },
      Cleaning: { FloorCare: ["broom", "mop", "bucket", "vacuum cleaner"], Supplies: ["spray bottle", "dustpan", "rubber gloves", "trash bag"] },
      LivingRoom: { Comfort: ["cushion", "candle", "vase", "tissue box"], Devices: ["remote control", "extension cord", "battery", "flashlight"] },
      Study: { WritingTools: ["pen", "pencil", "marker"], DeskTools: ["eraser", "ruler", "scissors", "tape", "notebook"] }
    };

    const MUSEUMS = [
      { id: "random", shortLabel: "Museum A", name: "Museum A", labelMode: "item-list", organization: "random" },
      { id: "listed", shortLabel: "Museum B", name: "Museum B", labelMode: "item-list", organization: "structured" },
      { id: "structured", shortLabel: "Museum C", name: "Museum C", labelMode: "category", organization: "structured" }
    ];
    const ROOM_SHAPES = ["shape-1", "shape-2", "shape-3", "shape-4", "shape-5", "shape-6"];
    const REFLECTION_OPTIONS = [
      { id: "a", text: "Museum A was hardest because its labels and room contents were arranged randomly.", correct: true },
      { id: "b", text: "Museum B was hardest because every room used obvious category labels that gave away the target.", correct: false },
      { id: "c", text: "Museum C was hardest because it removed all grouping and mixed every item together.", correct: false },
      { id: "d", text: "All museums were equally easy because layout and labeling never changed.", correct: false }
    ];
    const DRAG_ITEMS = [
      { id: "drag-topic", text: "A well-organized museum helps visitors understand the main idea before they notice smaller details.", level: "topic" },
      { id: "drag-support", text: "First, clear wings and labeled showrooms guide visitors toward related exhibits.", level: "support" },
      { id: "drag-example", text: "For example, a sign for Kitchen → Cookware quickly narrows the search to pots and pans.", level: "example" }
    ];

    let state = {
      activeMuseumIndex: 0,
      view: "museum",
      selectedShowroomId: null,
      selectedSectionId: null,
      layouts: {},
      museumResults: {},
      timerSeconds: 0,
      timerId: null,
      gameState: "idle",
      activeTarget: null,
      highlightedItem: null,
      modal: null,
      reflectionChoice: null,
      reflectionWhy: "",
      detailRating: 0,
      structureChoice: null,
      structureWhy: "",
      dragPlacements: { topic: null, support: null, example: null }
    };

    function shuffle(array) {
      const arr = [...array];
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }
    function chunk(array, size) { const out = []; for (let i = 0; i < array.length; i += size) out.push(array.slice(i, i + size)); return out; }
    function titleCase(text) { return text.replace(/([A-Z])/g, " $1").trim().replace(/^./, m => m.toUpperCase()); }
    function formatTime(totalSeconds) { const minutes = Math.floor(totalSeconds / 60); const seconds = String(totalSeconds % 60).padStart(2, "0"); return `${minutes}:${seconds}`; }
    function escapeHTML(str) { return String(str).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/\"/g, "&quot;").replace(/'/g, "&#39;"); }
    function pluralizeItem(item) { return item.endsWith('s') ? item : `${item}s`; }

    function buildStructuredMuseum(labelMode) {
      return Object.entries(SHOWROOM_SECTIONS).map(([showroomName, sections]) => {
        const sectionEntries = Object.entries(sections).map(([sectionName, items]) => ({
          id: `${showroomName}-${sectionName}`,
          name: labelMode === 'category' ? titleCase(sectionName) : items.join(', '),
          trueName: titleCase(sectionName),
          items
        }));
        const showroomItems = sectionEntries.flatMap(section => section.items);
        return { id: showroomName, name: labelMode === 'category' ? titleCase(showroomName) : showroomItems.join(', '), trueName: titleCase(showroomName), sections: sectionEntries };
      });
    }
    function buildRandomMuseum() {
      const allItems = Object.values(CATEGORY_ITEMS).flat();
      const showroomChunks = chunk(shuffle(allItems), Math.ceil(allItems.length / 6));
      return showroomChunks.map((itemsForShowroom, showroomIndex) => ({
        id: `random-${showroomIndex}`,
        name: itemsForShowroom.join(', '),
        trueName: `Showroom ${showroomIndex + 1}`,
        sections: chunk(itemsForShowroom, Math.max(2, Math.ceil(itemsForShowroom.length / 3))).map((items, sectionIndex) => ({
          id: `random-${showroomIndex}-${sectionIndex}`,
          name: items.join(', '),
          trueName: `Section ${sectionIndex + 1}`,
          items
        }))
      }));
    }
    function buildMuseum(museum) { return museum.organization === 'random' ? buildRandomMuseum() : buildStructuredMuseum(museum.labelMode); }
    function ensureLayouts() {
      MUSEUMS.forEach(museum => {
        if (!state.layouts[museum.id]) state.layouts[museum.id] = buildMuseum(museum);
      });
    }
    function getActiveMuseum() { return MUSEUMS[state.activeMuseumIndex]; }
    function getLayout() { ensureLayouts(); return state.layouts[getActiveMuseum().id]; }
    function getSelectedShowroom(layout) { return layout.find(showroom => showroom.id === state.selectedShowroomId) || null; }
    function getSelectedSection(showroom) { return showroom?.sections.find(section => section.id === state.selectedSectionId) || null; }
    function getLastShowroom(layout) { return layout[layout.length - 1]; }
    function pickTargetForMuseum(index) {
      const museum = MUSEUMS[index];
      const layout = state.layouts[museum.id] || buildMuseum(museum);
      state.layouts[museum.id] = layout;
      const lastShowroom = getLastShowroom(layout);
      const pool = lastShowroom.sections.flatMap(section => section.items);
      return shuffle(pool)[0];
    }
    function stopTimer() { if (state.timerId) { clearInterval(state.timerId); state.timerId = null; } }
    function scrollToId(id) { document.getElementById(id)?.scrollIntoView({ behavior: 'smooth', block: 'start' }); }
    function resetNavigation() { state.view = 'museum'; state.selectedShowroomId = null; state.selectedSectionId = null; state.highlightedItem = null; }
    function startMuseum(index = state.activeMuseumIndex) {
      stopTimer();
      ensureLayouts();
      state.activeMuseumIndex = index;
      resetNavigation();
      state.activeTarget = pickTargetForMuseum(index);
      state.timerSeconds = 0;
      state.gameState = 'running';
      state.modal = null;
      state.timerId = setInterval(() => { state.timerSeconds += 1; render(); }, 1000);
      render();
      scrollToId('museum-view');
    }
    function resetExperience() {
      stopTimer();
      state.layouts = {};
      state.museumResults = {};
      state.activeMuseumIndex = 0;
      state.activeTarget = null;
      state.timerSeconds = 0;
      state.gameState = 'idle';
      state.modal = null;
      state.reflectionChoice = null;
      state.reflectionWhy = '';
      state.detailRating = 0;
      state.structureChoice = null;
      state.structureWhy = '';
      state.dragPlacements = { topic: null, support: null, example: null };
      resetNavigation();
      ensureLayouts();
      render();
    }
    function openShowroom(id) { state.selectedShowroomId = id; state.selectedSectionId = null; state.view = 'showroom'; render(); }
    function openSection(id) { state.selectedSectionId = id; state.view = 'section'; render(); }
    function goBack() { if (state.view === 'section') { state.view = 'showroom'; state.selectedSectionId = null; } else if (state.view === 'showroom') { state.view = 'museum'; state.selectedShowroomId = null; } render(); }
    function goHome() { resetNavigation(); render(); }
    function completeMuseumWithItem(item) {
      stopTimer();
      const museum = getActiveMuseum();
      state.highlightedItem = item;
      state.gameState = 'museum-complete';
      state.museumResults[museum.id] = { museumName: museum.name, target: item, time: state.timerSeconds };
      const nextIndex = state.activeMuseumIndex + 1;
      const allDone = nextIndex >= MUSEUMS.length;
      state.modal = {
        museumName: museum.name,
        target: item,
        time: state.timerSeconds,
        type: allDone ? 'complete-all' : 'next-museum',
        nextMuseumName: allDone ? null : MUSEUMS[nextIndex].name
      };
      render();
    }
    function handleItemClick(item) {
      if (state.gameState !== 'running') return;
      if (item !== state.activeTarget) return;
      completeMuseumWithItem(item);
    }
    function proceedFromModal() {
      if (!state.modal) return;
      if (state.modal.type === 'next-museum') {
        startMuseum(state.activeMuseumIndex + 1);
      } else {
        state.modal = null;
        state.gameState = 'complete';
        render();
        scrollToId('reflection-section');
      }
    }
    function progressPercent() { return Object.keys(state.museumResults).length / MUSEUMS.length * 100; }
    function roomHTML({ title, subtitle, meta, icon, shapeClass, doorSide, dataAttrs = '', extraClass = '' }) {
      return `<button class="floor-room ${shapeClass} ${extraClass}" ${dataAttrs}><div class="room-outline"></div><div class="door-${doorSide}"></div><div class="room-head"><div><div class="room-kicker">${subtitle}</div><div class="room-title">${escapeHTML(title)}</div></div><div class="room-icon">${icon}</div></div><div class="room-meta">${escapeHTML(meta)}</div></button>`;
    }
    function renderMuseumView(layout) {
      const leftWing = layout.slice(0, 3), rightWing = layout.slice(3, 6), lastShowroom = getLastShowroom(layout);
      return `<div class="blueprint" id="museum-view"><div class="lobby"><div class="micro-label">Main lobby</div><div class="section-title">Museum View</div><div class="subtitle-text">Only the final showroom contains today's target. Search efficiently and click the correct item to stop the timer.</div></div><div class="prompt-box"><strong>Current target:</strong> Find <strong>${escapeHTML(state.activeTarget || 'a target')}</strong>. It is always hidden in the last showroom: <strong>${escapeHTML(lastShowroom.trueName || lastShowroom.name)}</strong>.</div><div class="two-wing"><div class="wing">${leftWing.map((showroom, index) => `<div class="connector-row-left">${roomHTML({ title: showroom.name, subtitle: showroom.id === lastShowroom.id ? 'Final showroom' : 'Showroom', meta: `${showroom.sections.length} sections`, icon: showroom.id === lastShowroom.id ? '🎯' : '🏛️', shapeClass: ROOM_SHAPES[index % ROOM_SHAPES.length], doorSide: 'right', dataAttrs: `data-action="open-showroom" data-showroom-id="${showroom.id}"` })}<div class="connector-right"></div></div>`).join('')}</div><div class="corridor-vertical"><div class="micro-label">Central</div><div class="vertical-text">Corridor</div><div class="micro-label">Hall</div></div><div class="wing">${rightWing.map((showroom, index) => `<div class="connector-row-right"><div class="connector-left"></div>${roomHTML({ title: showroom.name, subtitle: showroom.id === lastShowroom.id ? 'Final showroom' : 'Showroom', meta: `${showroom.sections.length} sections`, icon: showroom.id === lastShowroom.id ? '🎯' : '🏛️', shapeClass: ROOM_SHAPES[(index + 3) % ROOM_SHAPES.length], doorSide: 'left', dataAttrs: `data-action="open-showroom" data-showroom-id="${showroom.id}"` })}</div>`).join('')}</div></div></div>`;
    }
    function renderShowroomView(selectedShowroom) {
      const sections = selectedShowroom.sections, half = Math.ceil(sections.length / 2);
      const wings = [sections.slice(0, half), sections.slice(half)];
      return `<div class="blueprint simple-grid" id="museum-view"><div class="section-header-box"><div class="micro-label">Current showroom</div><div class="section-title">${escapeHTML(selectedShowroom.trueName)}</div><div class="subtitle-text">Open a section to inspect the exhibits.</div></div><div class="two-wing"><div class="wing">${wings[0].map((section, index) => `<div class="connector-row-left">${roomHTML({ title: section.name, subtitle: 'Section', meta: `${section.items.length} items`, icon: '🗺️', shapeClass: ROOM_SHAPES[(index + 1) % ROOM_SHAPES.length], doorSide: 'right', dataAttrs: `data-action="open-section" data-section-id="${section.id}"` })}<div class="connector-right"></div></div>`).join('')}</div><div class="corridor-vertical"><div class="micro-label">Section</div><div class="vertical-text">Corridor</div><div class="micro-label">Path</div></div><div class="wing">${wings[1].map((section, index) => `<div class="connector-row-right"><div class="connector-left"></div>${roomHTML({ title: section.name, subtitle: 'Section', meta: `${section.items.length} items`, icon: '🗺️', shapeClass: ROOM_SHAPES[(index + 3) % ROOM_SHAPES.length], doorSide: 'left', dataAttrs: `data-action="open-section" data-section-id="${section.id}"` })}</div>`).join('')}</div></div></div>`;
    }
    function renderSectionView(selectedSection) {
      const labels = selectedSection.items.map(pluralizeItem), midpoint = Math.ceil(labels.length / 2);
      function itemButton(label, item, side) {
        const highlighted = state.highlightedItem === item ? 'highlighted' : '';
        const targetBadge = item === state.activeTarget ? '<span class="badge">Target</span>' : '';
        return side === 'left'
          ? `<div class="connector-row-left"><button class="floor-room shape-5 item-room ${highlighted}" data-action="pick-item" data-item="${escapeHTML(item)}"><div class="room-head"><div class="room-title">${escapeHTML(label)}</div><div class="badge-list">${targetBadge}${highlighted ? '<span class="badge done">Found</span>' : ''}</div></div></button><div class="connector-right"></div></div>`
          : `<div class="connector-row-right"><div class="connector-left"></div><button class="floor-room shape-5 item-room ${highlighted}" data-action="pick-item" data-item="${escapeHTML(item)}"><div class="room-head"><div class="room-title">${escapeHTML(label)}</div><div class="badge-list">${targetBadge}${highlighted ? '<span class="badge done">Found</span>' : ''}</div></div></button></div>`;
      }
      return `<div class="blueprint simple-grid" id="museum-view"><div class="section-header-box"><div class="micro-label">Current section</div><div class="section-title">${escapeHTML(selectedSection.trueName)}</div><div class="subtitle-text">Stop the timer by clicking the correct exhibit.</div></div><div class="two-wing"><div class="wing">${labels.slice(0, midpoint).map((label, index) => itemButton(label, selectedSection.items[index], 'left')).join('')}</div><div class="corridor-vertical"><div class="micro-label">Exhibit</div><div class="vertical-text">Corridor</div><div class="micro-label">Route</div></div><div class="wing">${labels.slice(midpoint).map((label, offset) => itemButton(label, selectedSection.items[midpoint + offset], 'right')).join('')}</div></div></div>`;
    }
    function renderSidebar() {
      const activeMuseum = getActiveMuseum();
      return `<div class="panel-header"><h1 class="title">Museum Search Challenge</h1><div class="subtitle">Search one target per museum, compare completion times, and connect the experience to writing structure.</div></div><div class="panel-body"><div class="info-box"><div class="info-label">🎯 Current target</div><div class="badge-list">${state.activeTarget ? `<span class="badge dark">${escapeHTML(state.activeTarget)}</span>` : '<span class="badge">Press start to reveal a target</span>'}</div></div><div class="info-box"><div class="progress-meta"><div class="info-label" style="margin:0">⏱️ Stop timer</div><div class="timer-value">${formatTime(state.timerSeconds)}</div></div><div class="progress-bar"><div class="progress-fill" style="width:${Math.min(progressPercent(), 100)}%"></div></div><div class="subtitle" style="margin-top:10px">The timer counts up until the correct item is clicked.</div></div><div class="info-box"><div class="info-label">🏁 Museum progress</div><div class="badge-list">${MUSEUMS.map((museum, index) => `<span class="badge ${state.museumResults[museum.id] ? 'done' : index === state.activeMuseumIndex ? 'dark' : ''}">${museum.shortLabel}${state.museumResults[museum.id] ? ` · ${formatTime(state.museumResults[museum.id].time)}` : ''}</span>`).join('')}</div><div class="subtitle" style="margin-top:10px">Active museum: ${activeMuseum.name}</div></div><div class="button-row"><button class="btn btn-primary" data-action="start-game">${state.gameState === 'running' ? `Restart ${activeMuseum.name}` : 'Start search'}</button><button class="btn btn-secondary" data-action="reset-game">↻ Reset all</button></div></div>`;
    }
    function renderMain() {
      const activeMuseum = getActiveMuseum(), layout = getLayout(), selectedShowroom = getSelectedShowroom(layout), selectedSection = getSelectedSection(selectedShowroom);
      let content = renderMuseumView(layout);
      if (state.view === 'showroom' && selectedShowroom) content = renderShowroomView(selectedShowroom);
      if (state.view === 'section' && selectedSection) content = renderSectionView(selectedSection);
      return `<div class="main-panel-header"><div class="header-top"><h2 class="title" style="margin:0">${activeMuseum.name}</h2><div class="top-actions"><button class="pill-btn" data-action="go-back" ${state.view === 'museum' ? 'disabled' : ''}>← Back</button><button class="pill-btn" data-action="go-home" ${state.view === 'museum' ? 'disabled' : ''}>⌂ Top level</button></div></div><div class="museum-tabs">${MUSEUMS.map((museum, index) => `<button class="pill-btn ${index === state.activeMuseumIndex ? 'active' : ''}" data-action="switch-museum" data-museum-index="${index}" ${state.gameState === 'running' ? 'disabled' : ''}>${museum.shortLabel}</button>`).join('')}</div><div class="view-badges" style="margin-top:12px;"><span class="badge ${state.view === 'museum' ? 'dark' : ''}">1. Museum view</span><span class="badge ${state.view === 'showroom' ? 'dark' : ''}">2. Showroom view</span><span class="badge ${state.view === 'section' ? 'dark' : ''}">3. Section view</span><span class="badge dark">Status: ${state.gameState}</span></div></div><div class="map-wrapper">${content}</div>`;
    }
    function renderReflectionSection() {
      const doneCount = Object.keys(state.museumResults).length;
      const allDone = doneCount === MUSEUMS.length;
      return `<section class="section-card" id="reflection-section"><div class="section-pad"><h2 class="title">Compare the museum structures</h2><div class="subtitle">After trying each layout, reflect on which structure made the target hardest to find.</div></div><div class="section-body"><div class="summary-grid">${MUSEUMS.map(museum => `<div class="summary-card"><div class="micro-label">${museum.name}</div><strong>${state.museumResults[museum.id] ? formatTime(state.museumResults[museum.id].time) : '--:--'}</strong><div class="subtitle">${state.museumResults[museum.id] ? `Target: ${escapeHTML(state.museumResults[museum.id].target)}` : 'Complete the museum to record a time.'}</div></div>`).join('')}</div><div class="prompt-box"><div class="label-row">🧠 Which museum made finding the target most difficult?</div><div class="option-list">${REFLECTION_OPTIONS.map(option => { const chosen = state.reflectionChoice === option.id; const cls = chosen ? (option.correct ? 'correct' : 'incorrect') : ''; return `<button class="choice-btn option-card ${cls} ${chosen ? 'active' : ''}" data-action="pick-reflection" data-option-id="${option.id}" ${!allDone ? 'disabled' : ''}>${escapeHTML(option.text)}</button>`; }).join('')}</div><textarea data-action="reflection-why" placeholder="Explain your choice here..." style="width:100%;min-height:110px;margin-top:14px;border-radius:16px;border:1px solid var(--line);padding:12px;" ${!allDone ? 'disabled' : ''}>${escapeHTML(state.reflectionWhy)}</textarea><div class="subtitle">Correct answer: Museum A is usually the hardest because its random arrangement gives the fewest useful clues.</div></div></div></section>`;
    }
    function renderWritingSection() {
      const stars = [1,2,3,4,5].map(n => `<button class="star-btn ${state.detailRating >= n ? 'active' : ''}" data-action="pick-stars" data-stars="${n}">${'★'.repeat(n)}</button>`).join('');
      return `<section class="section-card" id="writing-section"><div class="section-pad"><h2 class="title">Connect the search to paragraph structure</h2><div class="subtitle">Use the paragraph below to think about levels of detail and organization.</div></div><div class="section-body"><div class="prompt-box"><div class="label-row">📘 Example paragraph</div><p>Visitors enter the science museum through a bright central hall that introduces the main theme of innovation. From there, each wing focuses on a related idea, such as energy, transportation, or communication, so the exhibits feel connected. Inside the transportation wing, one display shows a timeline of bicycles, cars, and trains to illustrate how each invention solved a different problem. This structure helps readers, like museum visitors, move from a broad topic to specific supporting details and examples.</p></div><div class="prompt-box"><div class="label-row">⭐ Mark the level of detail</div><div class="star-row">${stars}</div><div class="subtitle">More stars means you think the paragraph includes more specific detail.</div></div><div class="prompt-box"><div class="label-row">🏛️ Which museum structure does the writing resemble?</div><div class="pill-row">${MUSEUMS.map(museum => `<button class="pill-btn ${state.structureChoice === museum.id ? 'active' : ''}" data-action="pick-structure" data-museum-id="${museum.id}">${museum.name}</button>`).join('')}</div><textarea data-action="structure-why" placeholder="Why is the paragraph structured this way?" style="width:100%;min-height:110px;margin-top:14px;border-radius:16px;border:1px solid var(--line);padding:12px;">${escapeHTML(state.structureWhy)}</textarea><div class="subtitle">Hint: the paragraph moves from a broad entrance hall to wings and then a very specific exhibit example, so it resembles the most clearly categorized museum.</div></div></div></section>`;
    }
    function renderDragSection() {
      const placedIds = new Set(Object.values(state.dragPlacements).filter(Boolean));
      const bankItems = DRAG_ITEMS.filter(item => !placedIds.has(item.id));
      const correct = ['topic','support','example'].every(level => state.dragPlacements[level] && DRAG_ITEMS.find(item => item.id === state.dragPlacements[level]).level === level);
      return `<section class="section-card" id="drag-section"><div class="section-pad"><h2 class="title">Drag-and-drop detail practice</h2><div class="subtitle">Arrange the sentences from the broadest idea to the most specific example.</div></div><div class="section-body"><div class="drop-grid">${['topic','support','example'].map(level => `<div class="drop-zone" data-action="drop-zone" data-level="${level}"><h4>${level === 'topic' ? 'Topic sentence' : level === 'support' ? 'Supporting detail' : 'Example'}</h4>${state.dragPlacements[level] ? `<div class="drag-card placed" draggable="true" data-action="drag-item" data-drag-id="${state.dragPlacements[level]}">${escapeHTML(DRAG_ITEMS.find(item => item.id === state.dragPlacements[level]).text)}</div>` : '<div class="subtitle">Drop a sentence here.</div>'}</div>`).join('')}</div><div class="prompt-box" style="margin-top:18px"><div class="label-row">↕️ Sentence bank</div><div class="drag-bank">${bankItems.map(item => `<div class="drag-card" draggable="true" data-action="drag-item" data-drag-id="${item.id}">${escapeHTML(item.text)}</div>`).join('')}</div><div class="feedback">${Object.values(state.dragPlacements).every(Boolean) ? (correct ? 'Correct: the order moves from topic sentence to support to example.' : 'Not quite yet—try placing the broadest statement first and the most specific example last.') : 'Place all three sentences to check your answer.'}</div></div></div></section>`;
    }
    function renderModal() {
      if (!state.modal) return '';
      return `<div class="modal-backdrop"><div class="modal"><h3>${state.modal.museumName} complete</h3><p>You found <strong>${escapeHTML(state.modal.target)}</strong> in <strong>${formatTime(state.modal.time)}</strong>.</p><p>The correct item is highlighted in the section view so learners can connect the route with the final result.</p><div class="button-row" style="margin-top:20px"><button class="btn btn-primary" data-action="proceed-modal">${state.modal.type === 'next-museum' ? `Go to ${state.modal.nextMuseumName}` : 'Scroll to reflection section'}</button><button class="btn btn-secondary" data-action="close-modal">Stay here</button></div></div></div>`;
    }
    function attachEvents() {
      document.querySelectorAll('[data-action="start-game"]').forEach(btn => btn.addEventListener('click', () => startMuseum()));
      document.querySelectorAll('[data-action="reset-game"]').forEach(btn => btn.addEventListener('click', resetExperience));
      document.querySelectorAll('[data-action="go-back"]').forEach(btn => btn.addEventListener('click', () => { if (!btn.disabled) goBack(); }));
      document.querySelectorAll('[data-action="go-home"]').forEach(btn => btn.addEventListener('click', () => { if (!btn.disabled) goHome(); }));
      document.querySelectorAll('[data-action="switch-museum"]').forEach(btn => btn.addEventListener('click', () => { if (!btn.disabled) { state.activeMuseumIndex = Number(btn.dataset.museumIndex); resetNavigation(); state.activeTarget = null; state.timerSeconds = 0; state.gameState = 'idle'; render(); } }));
      document.querySelectorAll('[data-action="open-showroom"]').forEach(btn => btn.addEventListener('click', () => openShowroom(btn.dataset.showroomId)));
      document.querySelectorAll('[data-action="open-section"]').forEach(btn => btn.addEventListener('click', () => openSection(btn.dataset.sectionId)));
      document.querySelectorAll('[data-action="pick-item"]').forEach(btn => btn.addEventListener('click', () => handleItemClick(btn.dataset.item)));
      document.querySelectorAll('[data-action="proceed-modal"]').forEach(btn => btn.addEventListener('click', proceedFromModal));
      document.querySelectorAll('[data-action="close-modal"]').forEach(btn => btn.addEventListener('click', () => { state.modal = null; render(); }));
      document.querySelectorAll('[data-action="pick-reflection"]').forEach(btn => btn.addEventListener('click', () => { state.reflectionChoice = btn.dataset.optionId; render(); }));
      document.querySelectorAll('[data-action="pick-stars"]').forEach(btn => btn.addEventListener('click', () => { state.detailRating = Number(btn.dataset.stars); render(); }));
      document.querySelectorAll('[data-action="pick-structure"]').forEach(btn => btn.addEventListener('click', () => { state.structureChoice = btn.dataset.museumId; render(); }));
      document.querySelectorAll('[data-action="reflection-why"]').forEach(el => el.addEventListener('input', e => { state.reflectionWhy = e.target.value; }));
      document.querySelectorAll('[data-action="structure-why"]').forEach(el => el.addEventListener('input', e => { state.structureWhy = e.target.value; }));
      document.querySelectorAll('[data-action="drag-item"]').forEach(el => {
        el.addEventListener('dragstart', e => e.dataTransfer.setData('text/plain', el.dataset.dragId));
        el.addEventListener('dblclick', () => { Object.keys(state.dragPlacements).forEach(key => { if (state.dragPlacements[key] === el.dataset.dragId) state.dragPlacements[key] = null; }); render(); });
      });
      document.querySelectorAll('[data-action="drop-zone"]').forEach(zone => {
        zone.addEventListener('dragover', e => { e.preventDefault(); zone.classList.add('drag-over'); });
        zone.addEventListener('dragleave', () => zone.classList.remove('drag-over'));
        zone.addEventListener('drop', e => {
          e.preventDefault(); zone.classList.remove('drag-over');
          const dragId = e.dataTransfer.getData('text/plain');
          Object.keys(state.dragPlacements).forEach(key => { if (state.dragPlacements[key] === dragId) state.dragPlacements[key] = null; });
          state.dragPlacements[zone.dataset.level] = dragId;
          render();
        });
      });
    }
    function render() {
      ensureLayouts();
      document.getElementById('app').innerHTML = `<div class="app-stack"><div class="app-shell"><aside class="panel">${renderSidebar()}</aside><main class="panel">${renderMain()}</main></div>${renderReflectionSection()}${renderWritingSection()}${renderDragSection()}${renderModal()}</div>`;
      attachEvents();
    }
    ensureLayouts();
    render();
  </script>
</body>
</html>
