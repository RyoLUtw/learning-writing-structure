<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Museum Search Challenge</title>
  <style>
    :root {
      --bg1: #f1f5f9;
      --bg2: #e2e8f0;
      --muted: #f8fafc;
      --line: #cbd5e1;
      --wall: #334155;
      --text: #0f172a;
      --subtext: #64748b;
      --corridor: #cbd5e1;
      --corridor-dark: #94a3b8;
      --accent: #0f172a;
      --badge: #e2e8f0;
      --success: #16a34a;
      --highlight: #fef08a;
      --shadow: 0 10px 30px rgba(15, 23, 42, 0.08);
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    html, body { margin: 0; padding: 0; }
    body {
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--text);
      background: linear-gradient(to bottom, var(--bg1), var(--bg2));
      min-height: 100vh;
      padding: 16px;
    }
    .app-stack { max-width: 1280px; margin: 0 auto; display: grid; gap: 24px; }
    .app-shell { display: grid; gap: 24px; grid-template-columns: 320px 1fr; }
    .panel, .section-card { background: rgba(255,255,255,0.97); border-radius: 28px; box-shadow: 0 18px 40px rgba(15,23,42,0.12); overflow: hidden; }
    .panel-header, .section-pad { padding: 24px 24px 0; }
    .panel-body, .section-body { padding: 24px; }
    .title { font-size: 1.5rem; font-weight: 700; margin: 0; }
    .subtitle { color: var(--subtext); margin-top: 8px; line-height: 1.5; }
    .info-box, .prompt-box, .table-card { background: var(--muted); border-radius: 18px; padding: 16px; margin-bottom: 20px; border: 1px solid #e2e8f0; }
    .info-label, .label-row { display: flex; align-items: center; gap: 8px; font-size: 0.9rem; font-weight: 700; color: #334155; margin-bottom: 12px; }
    .badge-list, .pill-row, .star-row { display: flex; flex-wrap: wrap; gap: 8px; }
    .badge { display: inline-flex; align-items: center; justify-content: center; padding: 6px 10px; border-radius: 999px; background: var(--badge); color: #334155; font-size: 0.8rem; font-weight: 700; }
    .badge.dark, .pill-btn.active { background: var(--accent); color: white; }
    .badge.done { background: #dcfce7; color: #166534; }
    .progress-meta { display: flex; justify-content: space-between; gap: 12px; font-size: 0.9rem; color: #475569; margin-bottom: 10px; }
    .progress-bar { width: 100%; height: 10px; background: #e2e8f0; border-radius: 999px; overflow: hidden; }
    .progress-fill { height: 100%; background: var(--accent); transition: width 0.2s ease; }
    .timer-value { font-size: 1.15rem; font-weight: 700; font-variant-numeric: tabular-nums; }
    button { font: inherit; cursor: pointer; border: none; }
    .button-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .btn, .pill-btn, .star-btn, .move-btn {
      border-radius: 18px; padding: 12px 16px; font-weight: 600; border: 1px solid var(--line); background: white; color: #334155;
      transition: transform 0.12s ease, background 0.12s ease, border-color 0.12s ease;
    }
    .btn:hover, .pill-btn:hover, .star-btn:hover, .move-btn:hover { transform: translateY(-1px); }
    .btn-primary { background: var(--accent); color: white; border-color: var(--accent); }
    .btn:disabled, .pill-btn:disabled, .star-btn:disabled, .move-btn:disabled { opacity: 0.45; cursor: default; transform: none; }
    .star-btn.active, .pill-btn.active { background: var(--accent); border-color: var(--accent); color: white; }
    .main-panel-header { padding: 20px 24px; border-bottom: 1px solid #e2e8f0; background: rgba(255,255,255,0.85); }
    .header-top, .summary-grid { display: flex; justify-content: space-between; align-items: center; gap: 16px; flex-wrap: wrap; margin-bottom: 16px; }
    .museum-tabs, .view-badges, .top-actions { display: flex; gap: 8px; flex-wrap: wrap; }
    .pill-btn { border-radius: 999px; padding: 9px 16px; font-size: 0.9rem; font-weight: 700; }
    .map-wrapper { padding: 20px 24px 24px; }
    .blueprint { position: relative; overflow: hidden; border-radius: 32px; border: 4px solid var(--wall); background: var(--bg1); padding: 16px 16px 20px; box-shadow: inset 0 2px 10px rgba(15,23,42,0.08); }
    .blueprint::before { content: ""; position: absolute; inset: 0; pointer-events: none; background: radial-gradient(circle at top left, rgba(255,255,255,0.7), transparent 35%), linear-gradient(to right, rgba(148,163,184,0.12) 1px, transparent 1px), linear-gradient(to bottom, rgba(148,163,184,0.12) 1px, transparent 1px); background-size: auto, 28px 28px, 28px 28px; }
    .blueprint.simple-grid::before { background: linear-gradient(to right, rgba(148,163,184,0.1) 1px, transparent 1px), linear-gradient(to bottom, rgba(148,163,184,0.1) 1px, transparent 1px); background-size: 24px 24px, 24px 24px; }
    .blueprint > * { position: relative; }
    .lobby, .section-header-box { position: relative; margin-bottom: 20px; border-radius: 32px; border: 4px solid var(--wall); background: white; padding: 20px; text-align: center; box-shadow: 0 4px 12px rgba(15,23,42,0.05); }
    .lobby::after { content: ""; position: absolute; left: 50%; top: 100%; transform: translateX(-50%); width: 24px; height: 40px; background: var(--corridor); border-left: 4px solid var(--wall); border-right: 4px solid var(--wall); }
    .micro-label { font-size: 10px; text-transform: uppercase; letter-spacing: 0.35em; color: var(--subtext); }
    .section-title { margin-top: 8px; font-size: 1.25rem; font-weight: 700; }
    .subtitle-text { margin-top: 8px; font-size: 0.92rem; color: var(--subtext); }
    .two-wing { display: grid; gap: 16px; grid-template-columns: 1fr 88px 1fr; align-items: stretch; }
    .wing { display: grid; gap: 16px; }
    .corridor-vertical { display: flex; flex-direction: column; align-items: center; justify-content: space-between; border-radius: 32px; border: 4px solid var(--wall); background: var(--corridor-dark); padding: 16px 12px; text-align: center; }
    .vertical-text { writing-mode: vertical-rl; transform: rotate(180deg); text-transform: uppercase; letter-spacing: 0.2em; font-size: 0.9rem; font-weight: 700; color: #1e293b; }
    .connector-row-left, .connector-row-right { display: grid; align-items: center; gap: 0; }
    .connector-row-left { grid-template-columns: 1fr 52px; }
    .connector-row-right { grid-template-columns: 52px 1fr; }
    .connector-left, .connector-right { height: 20px; background: var(--corridor); }
    .connector-left { border-top: 4px solid var(--wall); border-bottom: 4px solid var(--wall); border-left: 4px solid var(--wall); border-top-left-radius: 999px; border-bottom-left-radius: 999px; }
    .connector-right { border-top: 4px solid var(--wall); border-bottom: 4px solid var(--wall); border-right: 4px solid var(--wall); border-top-right-radius: 999px; border-bottom-right-radius: 999px; }
    .floor-room { position: relative; width: 100%; min-height: 150px; border: 4px solid var(--wall); background: rgba(255,255,255,0.96); text-align: left; padding: 16px; box-shadow: var(--shadow); }
    .floor-room:hover { background: white; transform: scale(1.015); }
    .room-outline { position: absolute; inset: 8px; border: 1px dashed #cbd5e1; border-radius: 20px; pointer-events: none; }
    .door-right, .door-left { position: absolute; background: var(--bg1); top: 50%; transform: translateY(-50%); width: 12px; height: 64px; }
    .door-right { right: -2px; border-top: 4px solid var(--wall); border-bottom: 4px solid var(--wall); border-left: 4px solid var(--wall); border-top-left-radius: 999px; border-bottom-left-radius: 999px; }
    .door-left { left: -2px; border-top: 4px solid var(--wall); border-bottom: 4px solid var(--wall); border-right: 4px solid var(--wall); border-top-right-radius: 999px; border-bottom-right-radius: 999px; }
    .room-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; position: relative; z-index: 1; }
    .room-kicker { font-size: 10px; text-transform: uppercase; letter-spacing: 0.28em; color: var(--subtext); }
    .room-title { margin-top: 8px; font-size: 1rem; font-weight: 700; line-height: 1.35; word-break: break-word; }
    .room-meta { margin-top: 10px; font-size: 0.9rem; color: #475569; position: relative; z-index: 1; }
    .room-icon { font-size: 1.1rem; opacity: 0.75; }
    .shape-1 { border-top-left-radius: 48px; border-bottom-right-radius: 32px; border-top-right-radius: 20px; border-bottom-left-radius: 20px; }
    .shape-2 { border-top-left-radius: 28px; border-top-right-radius: 36px; border-bottom-left-radius: 32px; border-bottom-right-radius: 20px; }
    .shape-3 { border-top-right-radius: 48px; border-bottom-left-radius: 32px; border-top-left-radius: 20px; border-bottom-right-radius: 20px; }
    .shape-4 { border-bottom-left-radius: 48px; border-top-right-radius: 32px; border-top-left-radius: 20px; border-bottom-right-radius: 20px; }
    .shape-5 { border-radius: 28px; min-height: 96px; }
    .shape-6 { border-bottom-right-radius: 48px; border-top-left-radius: 32px; border-top-right-radius: 20px; border-bottom-left-radius: 20px; }
    .item-room.highlighted { background: var(--highlight); border-color: #ca8a04; box-shadow: 0 0 0 4px rgba(250,204,21,0.35); }
    .summary-card { flex: 1; min-width: 180px; border: 1px solid var(--line); border-radius: 16px; padding: 14px; background: white; }
    .summary-card strong { display: block; font-size: 1.2rem; margin-top: 6px; }
    table { width: 100%; border-collapse: collapse; }
    th, td { border: 1px solid var(--line); padding: 12px; vertical-align: top; text-align: left; }
    th { background: #f8fafc; }
    .checkbox-cell { text-align: center; }
    .star-grid { display: grid; gap: 14px; }
    .star-table .star-row { flex-wrap: nowrap; }
    .star-btn {
      width: clamp(36px, 4vw, 48px);
      height: clamp(36px, 4vw, 48px);
      padding: 0;
      border-radius: 50%;
      font-size: clamp(1rem, 2vw, 1.35rem);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex: 0 0 auto;
    }
    .floating-target {
      position: fixed;
      right: 24px;
      bottom: 24px;
      z-index: 900;
      width: min(320px, calc(100vw - 32px));
      background: rgba(15, 23, 42, 0.96);
      color: white;
      border-radius: 20px;
      padding: 16px;
      box-shadow: 0 20px 50px rgba(15,23,42,0.28);
    }
    .floating-target .micro-label { color: #cbd5e1; }
    .floating-target .target-title { font-size: 1.15rem; font-weight: 700; margin-top: 8px; }
    .floating-target .target-sub { margin-top: 8px; color: #e2e8f0; font-size: 0.92rem; line-height: 1.45; }
    .paragraph-block { display: grid; gap: 12px; margin-bottom: 20px; }
    .sentence-card { display: grid; grid-template-columns: 1fr auto; gap: 12px; align-items: center; border: 1px solid var(--line); border-radius: 16px; padding: 14px; background: white; transition: transform 0.22s ease, box-shadow 0.22s ease, background 0.22s ease; }
    .sentence-card.anchor { background: #0f172a; color: white; border-color: #0f172a; }
    .sentence-card.swapping { transform: scale(1.03); box-shadow: 0 14px 30px rgba(15, 23, 42, 0.18); }
    .move-stack { display: grid; gap: 8px; align-self: stretch; }
    .move-btn { width: 46px; height: 46px; padding: 0; display: inline-flex; align-items: center; justify-content: center; }
    .feedback { margin-top: 12px; font-weight: 600; }
    .modal-backdrop { position: fixed; inset: 0; background: rgba(15,23,42,0.55); display: flex; align-items: center; justify-content: center; padding: 20px; z-index: 1000; }
    .modal { max-width: 560px; width: 100%; background: white; border-radius: 28px; padding: 24px; box-shadow: 0 24px 60px rgba(15,23,42,0.25); }
    .modal h3 { margin-top: 0; font-size: 1.4rem; }
    textarea { width: 100%; min-height: 110px; margin-top: 14px; border-radius: 16px; border: 1px solid var(--line); padding: 12px; font: inherit; resize: vertical; }
    @media (max-width: 1100px) {
      .app-shell, .two-wing { grid-template-columns: 1fr; }
      .corridor-vertical, .connector-left, .connector-right { display: none; }
      .connector-row-left, .connector-row-right { grid-template-columns: 1fr; }
    }
    @media (max-width: 700px) {
      body { padding: 12px; }
      .button-row { grid-template-columns: 1fr; }
      .floating-target { right: 12px; bottom: 12px; width: calc(100vw - 24px); }
      .sentence-card { grid-template-columns: 1fr; }
      .move-stack { grid-auto-flow: column; }
    }
  </style>
</head>
<body>
  <div id="app"></div>
  <script>
    const CATEGORY_ITEMS = {
      Kitchen: ["plate", "bowl", "cup", "fork", "spoon", "knife", "pan", "pot", "kettle", "cutting board", "dish soap", "sponge"],
      Bedroom: ["pillow", "blanket", "hanger", "alarm clock", "lamp", "laundry basket", "bedsheet", "slippers", "mirror"],
      Bathroom: ["toothbrush", "toothpaste", "towel", "soap", "shampoo", "hair dryer", "toilet paper", "comb", "razor"],
      Cleaning: ["broom", "mop", "bucket", "vacuum cleaner", "spray bottle", "dustpan", "rubber gloves", "trash bag"],
      LivingRoom: ["remote control", "cushion", "candle", "vase", "extension cord", "battery", "flashlight", "tissue box"],
      Study: ["pen", "pencil", "eraser", "ruler", "scissors", "tape", "notebook", "marker"]
    };

    const SHOWROOM_SECTIONS = {
      Kitchen: { Cookware: ["pan", "pot", "kettle", "cutting board"], Tableware: ["plate", "bowl", "cup", "fork", "spoon", "knife"], Cleaning: ["dish soap", "sponge"] },
      Bedroom: { Bedding: ["pillow", "blanket", "bedsheet"], Storage: ["hanger", "laundry basket", "slippers"], Personal: ["alarm clock", "lamp", "mirror"] },
      Bathroom: { DentalCare: ["toothbrush", "toothpaste"], Bathing: ["towel", "soap", "shampoo"], Grooming: ["hair dryer", "toilet paper", "comb", "razor"] },
      Cleaning: { FloorCare: ["broom", "mop", "bucket", "vacuum cleaner"], Supplies: ["spray bottle", "dustpan", "rubber gloves", "trash bag"] },
      LivingRoom: { Comfort: ["cushion", "candle", "vase", "tissue box"], Devices: ["remote control", "extension cord", "battery", "flashlight"] },
      Study: { WritingTools: ["pen", "pencil", "marker"], DeskTools: ["eraser", "ruler", "scissors", "tape", "notebook"] }
    };

    const MUSEUMS = [
      { id: "random", shortLabel: "Museum A", name: "Museum A", labelMode: "item-list", organization: "random" },
      { id: "listed", shortLabel: "Museum B", name: "Museum B", labelMode: "item-list", organization: "structured" },
      { id: "structured", shortLabel: "Museum C", name: "Museum C", labelMode: "category", organization: "structured" }
    ];
    const ROOM_SHAPES = ["shape-1", "shape-2", "shape-3", "shape-4", "shape-5", "shape-6"];
    const COMPARISON_SCHEMES = [
      "All related items are put in the same showroom.",
      "Clear labels quickly show the common thing among all exhibit items.",
      "The route moves from broad categories to narrower subgroups.",
      "Visitors must rely on random scanning instead of helpful grouping.",
      "The display hides levels of detail, so everything feels equally specific.",
      "The organization helps visitors predict where a matching item will be."
    ];
    const PARAGRAPH_SENTENCES = [
      "New York is a noisy city.",
      "Traffic, sirens, and crowded sidewalks create a constant layer of sound from morning until late at night.",
      "For example, one person walking through Times Square might hear taxi horns, street performers, construction drills, and dozens of conversations all at once."
    ];
    const PRACTICE_SENTENCES = [
      { id: "p1-topic", paragraph: 1, type: "topic", anchor: true, text: "School gardens can teach students how communities work together." },
      { id: "p1-support", paragraph: 1, type: "support", anchor: false, text: "They give each class a shared job, such as planting, watering, and checking what the plants need." },
      { id: "p1-example", paragraph: 1, type: "example", anchor: false, text: "For example, one class might measure tomato growth each week and record the changes on a chart." },
      { id: "p2-topic", paragraph: 2, type: "topic", anchor: false, text: "Clear museum labels help visitors move from broad ideas to precise information." },
      { id: "p2-support", paragraph: 2, type: "support", anchor: true, text: "A strong layout first names the big section, then narrows the search with smaller grouped displays." },
      { id: "p2-example", paragraph: 2, type: "example", anchor: false, text: "For instance, a visitor can follow Kitchen → Cookware → pans instead of scanning every room at once." },
      { id: "p3-topic", paragraph: 3, type: "topic", anchor: false, text: "Good paragraphs organize ideas in a way that helps readers follow the writer’s thinking." },
      { id: "p3-support", paragraph: 3, type: "support", anchor: false, text: "Writers often begin with a main point, add a supporting detail, and end with a specific illustration." },
      { id: "p3-example", paragraph: 3, type: "example", anchor: true, text: "For example, a writer could introduce recycling, explain how sorting works, and then describe one classroom recycling station." }
    ];

    let state = {
      activeMuseumIndex: 0,
      view: "museum",
      selectedShowroomId: null,
      selectedSectionId: null,
      layouts: {},
      museumResults: {},
      museumDifficultyRatings: { random: 0, listed: 0, structured: 0 },
      comparisonChecks: Object.fromEntries(COMPARISON_SCHEMES.map(scheme => [scheme, []])),
      timerSeconds: 0,
      timerId: null,
      gameState: "idle",
      activeTarget: null,
      highlightedItem: null,
      modal: null,
      sentenceRatings: [0, 0, 0],
      structureChoice: null,
      structureWhy: "",
      practiceOrder: [],
      swappingSentenceId: null
    };

    function shuffle(array) { const arr = [...array]; for (let i = arr.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [arr[i], arr[j]] = [arr[j], arr[i]]; } return arr; }
    function chunk(array, size) { const out = []; for (let i = 0; i < array.length; i += size) out.push(array.slice(i, i + size)); return out; }
    function titleCase(text) { return text.replace(/([A-Z])/g, " $1").trim().replace(/^./, m => m.toUpperCase()); }
    function formatTime(totalSeconds) { const minutes = Math.floor(totalSeconds / 60); const seconds = String(totalSeconds % 60).padStart(2, "0"); return `${minutes}:${seconds}`; }
    function escapeHTML(str) { return String(str).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/\"/g, "&quot;").replace(/'/g, "&#39;"); }
    function pluralizeItem(item) { return item.endsWith("s") ? item : `${item}s`; }
    function renderStars(value, attrs) { return [1,2,3,4,5].map(n => `<button class="star-btn ${value >= n ? 'active' : ''}" ${attrs(n)}>★</button>`).join(''); }
    function getMuseumIndexById(id) { return MUSEUMS.findIndex(museum => museum.id === id); }

    function createInitialPracticeOrder() {
      const anchors = [1, 2, 3].map(paragraph => PRACTICE_SENTENCES.find(item => item.anchor && item.paragraph === paragraph));
      const others = shuffle(PRACTICE_SENTENCES.filter(sentence => !sentence.anchor));
      return [anchors[0], others[0], others[1], others[2], anchors[1], others[3], others[4], others[5], anchors[2]];
    }

    function buildStructuredMuseum(labelMode) {
      return Object.entries(SHOWROOM_SECTIONS).map(([showroomName, sections]) => {
        const sectionEntries = Object.entries(sections).map(([sectionName, items]) => ({ id: `${showroomName}-${sectionName}`, name: labelMode === "category" ? titleCase(sectionName) : items.join(", "), trueName: titleCase(sectionName), items }));
        const showroomItems = sectionEntries.flatMap(section => section.items);
        return { id: showroomName, name: labelMode === "category" ? titleCase(showroomName) : showroomItems.join(", "), trueName: titleCase(showroomName), sections: sectionEntries };
      });
    }
    function buildRandomMuseum() {
      const allItems = Object.values(CATEGORY_ITEMS).flat();
      const showroomChunks = chunk(shuffle(allItems), Math.ceil(allItems.length / 6));
      return showroomChunks.map((itemsForShowroom, showroomIndex) => ({
        id: `random-${showroomIndex}`,
        name: itemsForShowroom.join(", "),
        trueName: `Showroom ${showroomIndex + 1}`,
        sections: chunk(itemsForShowroom, Math.max(2, Math.ceil(itemsForShowroom.length / 3))).map((items, sectionIndex) => ({ id: `random-${showroomIndex}-${sectionIndex}`, name: items.join(", "), trueName: `Section ${sectionIndex + 1}`, items }))
      }));
    }
    function buildMuseum(museum) { return museum.organization === "random" ? buildRandomMuseum() : buildStructuredMuseum(museum.labelMode); }
    function ensureLayouts() { MUSEUMS.forEach(museum => { if (!state.layouts[museum.id]) state.layouts[museum.id] = buildMuseum(museum); }); }
    function getActiveMuseum() { return MUSEUMS[state.activeMuseumIndex]; }
    function getLayout() { ensureLayouts(); return state.layouts[getActiveMuseum().id]; }
    function getSelectedShowroom(layout) { return layout.find(showroom => showroom.id === state.selectedShowroomId) || null; }
    function getSelectedSection(showroom) { return showroom?.sections.find(section => section.id === state.selectedSectionId) || null; }
    function getLastShowroom(layout) { return layout[layout.length - 1]; }
    function pickTargetForMuseum(index) {
      const museum = MUSEUMS[index];
      const layout = state.layouts[museum.id] || buildMuseum(museum);
      state.layouts[museum.id] = layout;
      return shuffle(getLastShowroom(layout).sections.flatMap(section => section.items))[0];
    }
    function stopTimer() { if (state.timerId) { clearInterval(state.timerId); state.timerId = null; } }
    function scrollToId(id) { document.getElementById(id)?.scrollIntoView({ behavior: "smooth", block: "start" }); }
    function resetNavigation() { state.view = "museum"; state.selectedShowroomId = null; state.selectedSectionId = null; state.highlightedItem = null; }
    function prepareMuseum(index = state.activeMuseumIndex) {
      stopTimer();
      ensureLayouts();
      state.activeMuseumIndex = index;
      resetNavigation();
      state.activeTarget = pickTargetForMuseum(index);
      state.timerSeconds = 0;
      state.gameState = "ready";
      state.modal = { type: "target-reveal", museumName: MUSEUMS[index].name, target: state.activeTarget };
      render();
      scrollToId("museum-view");
    }
    function startSearchAfterReveal() {
      state.modal = null;
      state.gameState = "running";
      state.timerId = setInterval(() => { state.timerSeconds += 1; render(); }, 1000);
      render();
      scrollToId("museum-view");
    }
    function resetExperience() {
      stopTimer();
      state.layouts = {};
      state.museumResults = {};
      state.museumDifficultyRatings = { random: 0, listed: 0, structured: 0 };
      state.comparisonChecks = Object.fromEntries(COMPARISON_SCHEMES.map(scheme => [scheme, []]));
      state.activeMuseumIndex = 0;
      state.activeTarget = null;
      state.timerSeconds = 0;
      state.gameState = "idle";
      state.highlightedItem = null;
      state.modal = null;
      state.sentenceRatings = [0, 0, 0];
      state.structureChoice = null;
      state.structureWhy = "";
      state.practiceOrder = createInitialPracticeOrder();
      state.swappingSentenceId = null;
      resetNavigation();
      ensureLayouts();
      render();
    }
    function openShowroom(id) { state.selectedShowroomId = id; state.selectedSectionId = null; state.view = "showroom"; render(); scrollToId("museum-view"); }
    function openSection(id) { state.selectedSectionId = id; state.view = "section"; render(); scrollToId("museum-view"); }
    function goBack() { if (state.view === "section") { state.view = "showroom"; state.selectedSectionId = null; } else if (state.view === "showroom") { state.view = "museum"; state.selectedShowroomId = null; } render(); scrollToId("museum-view"); }
    function goHome() { resetNavigation(); render(); scrollToId("museum-view"); }
    function completeMuseumWithItem(item) {
      stopTimer();
      const museum = getActiveMuseum();
      state.highlightedItem = item;
      state.gameState = "museum-complete";
      state.museumResults[museum.id] = { museumName: museum.name, target: item, time: state.timerSeconds };
      const nextIndex = state.activeMuseumIndex + 1;
      const allDone = nextIndex >= MUSEUMS.length;
      state.modal = { type: "museum-complete", museumName: museum.name, target: item, time: state.timerSeconds, allDone, nextMuseumName: allDone ? null : MUSEUMS[nextIndex].name };
      render();
      scrollToId("museum-view");
    }
    function handleItemClick(item) { if (state.gameState === "running" && item === state.activeTarget) completeMuseumWithItem(item); }
    function proceedFromCompletion() {
      if (!state.modal || state.modal.type !== "museum-complete") return;
      if (state.modal.allDone) {
        state.modal = null;
        state.gameState = "complete";
        render();
        scrollToId("reflection-section");
      } else {
        prepareMuseum(state.activeMuseumIndex + 1);
      }
    }
    function progressPercent() { return Object.keys(state.museumResults).length / MUSEUMS.length * 100; }
    function roomHTML({ title, subtitle, meta, icon, shapeClass, doorSide, dataAttrs = "" }) {
      return `<button class="floor-room ${shapeClass}" ${dataAttrs}><div class="room-outline"></div><div class="door-${doorSide}"></div><div class="room-head"><div><div class="room-kicker">${subtitle}</div><div class="room-title">${escapeHTML(title)}</div></div><div class="room-icon">${icon}</div></div><div class="room-meta">${escapeHTML(meta)}</div></button>`;
    }
    function renderMuseumView(layout) {
      const leftWing = layout.slice(0, 3), rightWing = layout.slice(3, 6), lastShowroom = getLastShowroom(layout);
      return `<div class="blueprint" id="museum-view"><div class="lobby"><div class="micro-label">Main lobby</div><div class="section-title">Museum View</div><div class="subtitle-text">The target is always hidden in the final showroom. Open rooms, move down through the layers, and stop the timer by clicking the correct exhibit.</div></div><div class="prompt-box"><strong>Final showroom for this run:</strong> ${escapeHTML(lastShowroom.trueName || lastShowroom.name)}<div class="subtitle" style="margin-top:10px">The floating target card at the bottom-right stays visible until all museum challenges are complete.</div></div><div class="two-wing"><div class="wing">${leftWing.map((showroom, index) => `<div class="connector-row-left">${roomHTML({ title: showroom.name, subtitle: showroom.id === lastShowroom.id ? "Final showroom" : "Showroom", meta: `${showroom.sections.length} sections`, icon: showroom.id === lastShowroom.id ? "🎯" : "🏛️", shapeClass: ROOM_SHAPES[index % ROOM_SHAPES.length], doorSide: "right", dataAttrs: `data-action="open-showroom" data-showroom-id="${showroom.id}"` })}<div class="connector-right"></div></div>`).join('')}</div><div class="corridor-vertical"><div class="micro-label">Central</div><div class="vertical-text">Corridor</div><div class="micro-label">Hall</div></div><div class="wing">${rightWing.map((showroom, index) => `<div class="connector-row-right"><div class="connector-left"></div>${roomHTML({ title: showroom.name, subtitle: showroom.id === lastShowroom.id ? "Final showroom" : "Showroom", meta: `${showroom.sections.length} sections`, icon: showroom.id === lastShowroom.id ? "🎯" : "🏛️", shapeClass: ROOM_SHAPES[(index + 3) % ROOM_SHAPES.length], doorSide: "left", dataAttrs: `data-action="open-showroom" data-showroom-id="${showroom.id}"` })}</div>`).join('')}</div></div></div>`;
    }
    function renderShowroomView(selectedShowroom) {
      const sections = selectedShowroom.sections, half = Math.ceil(sections.length / 2), wings = [sections.slice(0, half), sections.slice(half)];
      return `<div class="blueprint simple-grid" id="museum-view"><div class="section-header-box"><div class="micro-label">Current showroom</div><div class="section-title">${escapeHTML(selectedShowroom.trueName)}</div><div class="subtitle-text">Choose a section to inspect the items inside it.</div></div><div class="two-wing"><div class="wing">${wings[0].map((section, index) => `<div class="connector-row-left">${roomHTML({ title: section.name, subtitle: "Section", meta: `${section.items.length} items`, icon: "🗺️", shapeClass: ROOM_SHAPES[(index + 1) % ROOM_SHAPES.length], doorSide: "right", dataAttrs: `data-action="open-section" data-section-id="${section.id}"` })}<div class="connector-right"></div></div>`).join('')}</div><div class="corridor-vertical"><div class="micro-label">Section</div><div class="vertical-text">Corridor</div><div class="micro-label">Path</div></div><div class="wing">${wings[1].map((section, index) => `<div class="connector-row-right"><div class="connector-left"></div>${roomHTML({ title: section.name, subtitle: "Section", meta: `${section.items.length} items`, icon: "🗺️", shapeClass: ROOM_SHAPES[(index + 3) % ROOM_SHAPES.length], doorSide: "left", dataAttrs: `data-action="open-section" data-section-id="${section.id}"` })}</div>`).join('')}</div></div></div>`;
    }
    function renderSectionView(selectedSection) {
      const labels = selectedSection.items.map(pluralizeItem), midpoint = Math.ceil(labels.length / 2);
      function itemButton(label, item, side) {
        const highlighted = state.highlightedItem === item ? "highlighted" : "";
        const targetBadge = item === state.activeTarget ? '<span class="badge">Target</span>' : '';
        const inner = `<button class="floor-room shape-5 item-room ${highlighted}" data-action="pick-item" data-item="${escapeHTML(item)}"><div class="room-head"><div class="room-title">${escapeHTML(label)}</div><div class="badge-list">${targetBadge}${highlighted ? '<span class="badge done">Found</span>' : ''}</div></div></button>`;
        return side === "left" ? `<div class="connector-row-left">${inner}<div class="connector-right"></div></div>` : `<div class="connector-row-right"><div class="connector-left"></div>${inner}</div>`;
      }
      return `<div class="blueprint simple-grid" id="museum-view"><div class="section-header-box"><div class="micro-label">Current section</div><div class="section-title">${escapeHTML(selectedSection.trueName)}</div><div class="subtitle-text">Click the correct exhibit to stop the timer.</div></div><div class="two-wing"><div class="wing">${labels.slice(0, midpoint).map((label, index) => itemButton(label, selectedSection.items[index], "left")).join('')}</div><div class="corridor-vertical"><div class="micro-label">Exhibit</div><div class="vertical-text">Corridor</div><div class="micro-label">Route</div></div><div class="wing">${labels.slice(midpoint).map((label, offset) => itemButton(label, selectedSection.items[midpoint + offset], "right")).join('')}</div></div></div>`;
    }
    function renderSidebar() {
      const activeMuseum = getActiveMuseum();
      return `<div class="panel-header"><h1 class="title">Museum Search Challenge</h1><div class="subtitle">Search one target per museum, compare the layouts, and transfer what you learn into paragraph structure.</div></div><div class="panel-body"><div class="info-box"><div class="progress-meta"><div class="info-label" style="margin:0">⏱️ Stop timer</div><div class="timer-value">${formatTime(state.timerSeconds)}</div></div><div class="progress-bar"><div class="progress-fill" style="width:${Math.min(progressPercent(),100)}%"></div></div><div class="subtitle" style="margin-top:10px">The timer starts only after the reveal modal’s start button is clicked.</div></div><div class="info-box"><div class="info-label">🏁 Museum progress</div><div class="badge-list">${MUSEUMS.map((museum, index) => `<span class="badge ${state.museumResults[museum.id] ? 'done' : index === state.activeMuseumIndex ? 'dark' : ''}">${museum.shortLabel}${state.museumResults[museum.id] ? ` · ${formatTime(state.museumResults[museum.id].time)}` : ''}</span>`).join('')}</div><div class="subtitle" style="margin-top:10px">Active museum: ${activeMuseum.name}</div></div><div class="button-row"><button class="btn btn-primary" data-action="start-game">${state.gameState === 'running' || state.gameState === 'ready' ? `Restart ${activeMuseum.name}` : 'Reveal target'}</button><button class="btn" data-action="reset-game">↻ Reset all</button></div></div>`;
    }
    function renderFloatingTarget() {
      if (!state.activeTarget || state.gameState === 'complete') return '';
      return `<div class="floating-target"><div class="micro-label">Current target</div><div class="target-title">${escapeHTML(state.activeTarget)}</div><div class="target-sub">Search inside the final showroom for ${getActiveMuseum().name}. This card hides once all museum challenges are complete.</div></div>`;
    }
    function renderMain() {
      const activeMuseum = getActiveMuseum(), layout = getLayout(), selectedShowroom = getSelectedShowroom(layout), selectedSection = getSelectedSection(selectedShowroom);
      let content = renderMuseumView(layout);
      if (state.view === "showroom" && selectedShowroom) content = renderShowroomView(selectedShowroom);
      if (state.view === "section" && selectedSection) content = renderSectionView(selectedSection);
      return `<div class="main-panel-header"><div class="header-top"><h2 class="title" style="margin:0">${activeMuseum.name}</h2><div class="top-actions"><button class="pill-btn" data-action="go-back" ${state.view === 'museum' ? 'disabled' : ''}>← Back</button><button class="pill-btn" data-action="go-home" ${state.view === 'museum' ? 'disabled' : ''}>⌂ Top level</button></div></div><div class="museum-tabs">${MUSEUMS.map((museum, index) => `<button class="pill-btn ${index === state.activeMuseumIndex ? 'active' : ''}" data-action="switch-museum" data-museum-index="${index}" ${state.gameState === 'running' ? 'disabled' : ''}>${museum.shortLabel}</button>`).join('')}</div><div class="view-badges" style="margin-top:12px;"><span class="badge ${state.view === 'museum' ? 'dark' : ''}">1. Museum view</span><span class="badge ${state.view === 'showroom' ? 'dark' : ''}">2. Showroom view</span><span class="badge ${state.view === 'section' ? 'dark' : ''}">3. Section view</span><span class="badge dark">Status: ${state.gameState}</span></div></div><div class="map-wrapper">${content}</div>`;
    }
    function renderReflectionSection() {
      const allDone = Object.keys(state.museumResults).length === MUSEUMS.length;
      return `<section class="section-card" id="reflection-section"><div class="section-pad"><h2 class="title">Compare the museum structures</h2><div class="subtitle">Rate each museum’s difficulty and check which organizational or presentation schemes match each museum.</div></div><div class="section-body"><div class="summary-grid">${MUSEUMS.map(museum => `<div class="summary-card"><div class="micro-label">${museum.name}</div><strong>${state.museumResults[museum.id] ? formatTime(state.museumResults[museum.id].time) : '--:--'}</strong><div class="subtitle">${state.museumResults[museum.id] ? `Target: ${escapeHTML(state.museumResults[museum.id].target)}` : 'Complete the museum to record a time.'}</div></div>`).join('')}</div><div class="table-card star-table"><div class="label-row">⭐ Rate how difficult it was to find the target in each museum</div><table><thead><tr><th>Museum</th><th>Difficulty rating</th></tr></thead><tbody>${MUSEUMS.map(museum => `<tr><td>${museum.name}</td><td><div class="star-row">${renderStars(state.museumDifficultyRatings[museum.id], n => `data-action="pick-museum-difficulty" data-museum-id="${museum.id}" data-stars="${n}" ${!allDone ? 'disabled' : ''}`)}</div></td></tr>`).join('')}</tbody></table></div><div class="table-card"><div class="label-row">☑️ Check the scheme(s) that match each museum</div><table><thead><tr><th>Organization / presentation scheme</th>${MUSEUMS.map(museum => `<th class="checkbox-cell">${museum.shortLabel}</th>`).join('')}</tr></thead><tbody>${COMPARISON_SCHEMES.map(scheme => `<tr><td>${escapeHTML(scheme)}</td>${MUSEUMS.map(museum => { const checked = state.comparisonChecks[scheme].includes(museum.id); return `<td class="checkbox-cell"><input type="checkbox" data-action="toggle-comparison" data-scheme="${escapeHTML(scheme)}" data-museum-id="${museum.id}" ${checked ? 'checked' : ''} ${!allDone ? 'disabled' : ''}></td>`; }).join('')}</tr>`).join('')}</tbody></table><div class="subtitle">Include both positive and negative schemes to show how the museums differ.</div></div></div></section>`;
    }
    function renderWritingSection() {
      return `<section class="section-card" id="writing-section"><div class="section-pad"><h2 class="title">Connect the search to paragraph structure</h2><div class="subtitle">Notice how the paragraph grows more detailed from sentence to sentence.</div></div><div class="section-body"><div class="prompt-box"><div class="label-row">📘 Example paragraph</div><p>${PARAGRAPH_SENTENCES.join(' ')}</p></div><div class="table-card star-table"><div class="label-row">📈 Rate each sentence as the detail increases</div><table><thead><tr><th>Sentence</th><th>Detail rating</th></tr></thead><tbody>${PARAGRAPH_SENTENCES.map((sentence, index) => `<tr><td><strong>Sentence ${index + 1}</strong><div class="subtitle">${escapeHTML(sentence)}</div></td><td><div class="star-row">${renderStars(state.sentenceRatings[index], n => `data-action="pick-sentence-stars" data-index="${index}" data-stars="${n}"`)}</div></td></tr>`).join('')}</tbody></table></div><div class="prompt-box"><div class="label-row">🏛️ Which museum structure does the writing resemble?</div><div class="pill-row">${MUSEUMS.map(museum => `<button class="pill-btn ${state.structureChoice === museum.id ? 'active' : ''}" data-action="pick-structure" data-museum-id="${museum.id}">${museum.name}</button>`).join('')}</div><textarea data-action="structure-why" placeholder="Why is the paragraph structured this way?">${escapeHTML(state.structureWhy)}</textarea><div class="subtitle">Think about which museum most clearly moves from a broad label to increasingly specific levels of detail.</div></div></div></section>`;
    }
    function renderPracticeParagraph(paragraphNumber) {
      const start = (paragraphNumber - 1) * 3;
      const sentences = state.practiceOrder.slice(start, start + 3);
      return `<div class="paragraph-block"><div class="label-row">🧩 Paragraph ${paragraphNumber}</div>${sentences.map((sentence, index) => { const globalIndex = start + index; return `<div class="sentence-card ${sentence.anchor ? 'anchor' : ''} ${state.swappingSentenceId === sentence.id ? 'swapping' : ''}"><div>${escapeHTML(sentence.text)}</div><div class="move-stack">${sentence.anchor ? '' : `<button class="move-btn" data-action="move-sentence" data-index="${globalIndex}" data-direction="up">↑</button><button class="move-btn" data-action="move-sentence" data-index="${globalIndex}" data-direction="down">↓</button>`}</div></div>`; }).join('')}</div>`;
    }
    function paragraphPracticeCorrect() {
      return [0,1,2].every(group => {
        const slice = state.practiceOrder.slice(group * 3, group * 3 + 3);
        return slice.map(sentence => sentence.paragraph).every(paragraph => paragraph === group + 1) && slice.map(sentence => sentence.type).join('|') === 'topic|support|example';
      });
    }
    function renderPracticeSection() {
      return `<section class="section-card" id="drag-section"><div class="section-pad"><h2 class="title">Sentence ordering practice</h2><div class="subtitle">Reorder all nine sentences so relevant ideas stay in the same paragraph and each paragraph reads from topic sentence to supporting detail to example.</div></div><div class="section-body">${[1,2,3].map(renderPracticeParagraph).join('')}<div class="prompt-box"><div class="feedback">${paragraphPracticeCorrect() ? 'Correct: the sentences are grouped into the right paragraphs and arranged from topic sentence to supporting detail to example.' : 'Use the up/down arrows to regroup related ideas and arrange each paragraph from topic sentence to supporting detail to example.'}</div></div></div></section>`;
    }
    function renderModal() {
      if (!state.modal) return '';
      if (state.modal.type === 'target-reveal') {
        return `<div class="modal-backdrop"><div class="modal"><h3>${state.modal.museumName}: reveal the target</h3><p>Your target for this museum is <strong>${escapeHTML(state.modal.target)}</strong>.</p><p>When you press start, the search begins and the page scrolls to the top of the museum view container.</p><div class="button-row" style="margin-top:20px"><button class="btn btn-primary" data-action="start-revealed-search">Start search</button><button class="btn" data-action="close-modal">Stay here</button></div></div></div>`;
      }
      return `<div class="modal-backdrop"><div class="modal"><h3>${state.modal.museumName} complete</h3><p>You found <strong>${escapeHTML(state.modal.target)}</strong> in <strong>${formatTime(state.modal.time)}</strong>.</p><p>The item remains highlighted in the section view so students can connect the route with the final result.</p><div class="button-row" style="margin-top:20px"><button class="btn btn-primary" data-action="proceed-modal">${state.modal.allDone ? 'Go to the next section' : `Go to ${state.modal.nextMuseumName}`}</button><button class="btn" data-action="close-modal">Stay here</button></div></div></div>`;
    }
    function moveSentence(index, direction) {
      const arr = [...state.practiceOrder];
      const nextIndex = direction === 'up' ? index - 1 : index + 1;
      if (nextIndex < 0 || nextIndex >= arr.length) return;
      if (arr[index].anchor || arr[nextIndex].anchor) return;
      state.swappingSentenceId = arr[index].id;
      [arr[index], arr[nextIndex]] = [arr[nextIndex], arr[index]];
      state.practiceOrder = arr;
      render();
      setTimeout(() => { state.swappingSentenceId = null; render(); }, 220);
    }
    function toggleComparison(scheme, museumId, checked) {
      const current = new Set(state.comparisonChecks[scheme] || []);
      if (checked) current.add(museumId); else current.delete(museumId);
      state.comparisonChecks[scheme] = [...current];
    }
    function attachEvents() {
      document.querySelectorAll('[data-action="start-game"]').forEach(btn => btn.addEventListener('click', () => prepareMuseum()));
      document.querySelectorAll('[data-action="reset-game"]').forEach(btn => btn.addEventListener('click', resetExperience));
      document.querySelectorAll('[data-action="go-back"]').forEach(btn => btn.addEventListener('click', () => { if (!btn.disabled) goBack(); }));
      document.querySelectorAll('[data-action="go-home"]').forEach(btn => btn.addEventListener('click', () => { if (!btn.disabled) goHome(); }));
      document.querySelectorAll('[data-action="switch-museum"]').forEach(btn => btn.addEventListener('click', () => { if (!btn.disabled) { state.activeMuseumIndex = Number(btn.dataset.museumIndex); stopTimer(); state.activeTarget = null; state.timerSeconds = 0; state.gameState = 'idle'; state.modal = null; resetNavigation(); render(); scrollToId('museum-view'); } }));
      document.querySelectorAll('[data-action="open-showroom"]').forEach(btn => btn.addEventListener('click', () => openShowroom(btn.dataset.showroomId)));
      document.querySelectorAll('[data-action="open-section"]').forEach(btn => btn.addEventListener('click', () => openSection(btn.dataset.sectionId)));
      document.querySelectorAll('[data-action="pick-item"]').forEach(btn => btn.addEventListener('click', () => handleItemClick(btn.dataset.item)));
      document.querySelectorAll('[data-action="start-revealed-search"]').forEach(btn => btn.addEventListener('click', startSearchAfterReveal));
      document.querySelectorAll('[data-action="proceed-modal"]').forEach(btn => btn.addEventListener('click', proceedFromCompletion));
      document.querySelectorAll('[data-action="close-modal"]').forEach(btn => btn.addEventListener('click', () => { state.modal = null; render(); }));
      document.querySelectorAll('[data-action="pick-museum-difficulty"]').forEach(btn => btn.addEventListener('click', () => { state.museumDifficultyRatings[btn.dataset.museumId] = Number(btn.dataset.stars); render(); }));
      document.querySelectorAll('[data-action="toggle-comparison"]').forEach(input => input.addEventListener('change', e => { toggleComparison(e.target.dataset.scheme, e.target.dataset.museumId, e.target.checked); }));
      document.querySelectorAll('[data-action="pick-sentence-stars"]').forEach(btn => btn.addEventListener('click', () => { state.sentenceRatings[Number(btn.dataset.index)] = Number(btn.dataset.stars); render(); }));
      document.querySelectorAll('[data-action="pick-structure"]').forEach(btn => btn.addEventListener('click', () => { state.structureChoice = btn.dataset.museumId; render(); }));
      document.querySelectorAll('[data-action="structure-why"]').forEach(el => el.addEventListener('input', e => { state.structureWhy = e.target.value; }));
      document.querySelectorAll('[data-action="move-sentence"]').forEach(btn => btn.addEventListener('click', () => moveSentence(Number(btn.dataset.index), btn.dataset.direction)));
    }
    function render() {
      ensureLayouts();
      if (!state.practiceOrder.length) state.practiceOrder = createInitialPracticeOrder();
      document.getElementById('app').innerHTML = `<div class="app-stack"><div class="app-shell"><aside class="panel">${renderSidebar()}</aside><main class="panel">${renderMain()}</main></div>${renderReflectionSection()}${renderWritingSection()}${renderPracticeSection()}${renderFloatingTarget()}${renderModal()}</div>`;
      attachEvents();
    }
    state.practiceOrder = createInitialPracticeOrder();
    ensureLayouts();
    render();
  </script>
</body>
</html>
