<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Museum Search Challenge</title>
  <style>
    :root {
      --bg1: #f1f5f9;
      --bg2: #e2e8f0;
      --card: #ffffff;
      --muted: #f8fafc;
      --line: #cbd5e1;
      --wall: #334155;
      --text: #0f172a;
      --subtext: #64748b;
      --corridor: #cbd5e1;
      --corridor-dark: #94a3b8;
      --accent: #0f172a;
      --accent-text: #ffffff;
      --badge: #e2e8f0;
      --shadow: 0 10px 30px rgba(15, 23, 42, 0.08);
      --shadow-strong: 0 10px 24px rgba(15, 23, 42, 0.08);
      --radius-xl: 32px;
      --radius-lg: 24px;
      --radius-md: 18px;
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--text);
      background: linear-gradient(to bottom, var(--bg1), var(--bg2));
      min-height: 100vh;
      padding: 16px;
    }

    .app-shell {
      max-width: 1280px;
      margin: 0 auto;
      display: grid;
      gap: 24px;
      grid-template-columns: 320px 1fr;
    }

    .panel {
      background: rgba(255,255,255,0.96);
      border-radius: 28px;
      box-shadow: 0 18px 40px rgba(15,23,42,0.12);
      overflow: hidden;
    }

    .panel-header {
      padding: 24px 24px 0 24px;
    }

    .panel-body {
      padding: 24px;
    }

    .title {
      font-size: 1.5rem;
      font-weight: 700;
      margin: 0;
    }

    .info-box {
      background: var(--muted);
      border-radius: 18px;
      padding: 16px;
      margin-bottom: 20px;
    }

    .info-label {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.9rem;
      font-weight: 600;
      color: #334155;
      margin-bottom: 12px;
    }

    .badge-list {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 6px 10px;
      border-radius: 999px;
      background: var(--badge);
      color: #334155;
      font-size: 0.8rem;
      font-weight: 600;
      white-space: nowrap;
    }

    .badge.found, .badge.dark {
      background: var(--accent);
      color: white;
    }

    .progress-bar {
      width: 100%;
      height: 10px;
      background: #e2e8f0;
      border-radius: 999px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      background: var(--accent);
      width: 0%;
      transition: width 0.2s ease;
    }

    .progress-meta {
      display: flex;
      justify-content: space-between;
      font-size: 0.9rem;
      color: #475569;
      margin-bottom: 10px;
    }

    .timer-value {
      font-size: 1.15rem;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
    }

    .button-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    button {
      font: inherit;
      cursor: pointer;
      border: none;
    }

    .btn {
      border-radius: 18px;
      padding: 12px 16px;
      font-weight: 600;
      transition: transform 0.12s ease, background 0.12s ease, border-color 0.12s ease;
    }

    .btn:hover { transform: translateY(-1px); }
    .btn:active { transform: scale(0.99); }

    .btn-primary {
      background: var(--accent);
      color: white;
    }

    .btn-secondary {
      background: white;
      color: #334155;
      border: 1px solid var(--line);
    }

    .main-panel-header {
      padding: 20px 24px;
      border-bottom: 1px solid #e2e8f0;
      background: rgba(255,255,255,0.85);
      backdrop-filter: blur(8px);
    }

    .header-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
      margin-bottom: 16px;
    }

    .top-actions, .museum-tabs, .view-badges {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .pill-btn {
      border-radius: 999px;
      padding: 9px 16px;
      font-size: 0.9rem;
      font-weight: 700;
      border: 1px solid var(--line);
      background: white;
      color: #334155;
    }

    .pill-btn.active {
      background: var(--accent);
      border-color: var(--accent);
      color: white;
    }

    .pill-btn:disabled {
      opacity: 0.45;
      cursor: default;
      transform: none;
    }

    .map-wrapper {
      padding: 20px 24px 24px 24px;
    }

    .blueprint {
      position: relative;
      overflow: hidden;
      border-radius: 32px;
      border: 4px solid var(--wall);
      background: var(--bg1);
      padding: 16px 16px 20px 16px;
      box-shadow: inset 0 2px 10px rgba(15,23,42,0.08);
    }

    .blueprint::before {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      background:
        radial-gradient(circle at top left, rgba(255,255,255,0.7), transparent 35%),
        linear-gradient(to right, rgba(148,163,184,0.12) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(148,163,184,0.12) 1px, transparent 1px);
      background-size: auto, 28px 28px, 28px 28px;
    }

    .blueprint.simple-grid::before {
      background:
        linear-gradient(to right, rgba(148,163,184,0.1) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(148,163,184,0.1) 1px, transparent 1px);
      background-size: 24px 24px, 24px 24px;
    }

    .blueprint > * { position: relative; }

    .lobby {
      position: relative;
      margin-bottom: 20px;
      border-radius: 32px;
      border: 4px solid var(--wall);
      background: white;
      padding: 20px;
      text-align: center;
      box-shadow: 0 4px 12px rgba(15,23,42,0.05);
    }

    .lobby::after {
      content: "";
      position: absolute;
      left: 50%;
      top: 100%;
      transform: translateX(-50%);
      width: 24px;
      height: 40px;
      background: var(--corridor);
      border-left: 4px solid var(--wall);
      border-right: 4px solid var(--wall);
    }

    .micro-label {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.35em;
      color: var(--subtext);
    }

    .subtitle-text {
      margin-top: 8px;
      font-size: 0.92rem;
      color: var(--subtext);
    }

    .section-title {
      margin-top: 8px;
      font-size: 1.25rem;
      font-weight: 700;
    }

    .two-wing {
      display: grid;
      gap: 16px;
      grid-template-columns: 1fr 88px 1fr;
      align-items: stretch;
    }

    .wing {
      display: grid;
      gap: 16px;
    }

    .corridor-vertical {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      border-radius: 32px;
      border: 4px solid var(--wall);
      background: var(--corridor-dark);
      color: #334155;
      padding: 16px 12px;
      text-align: center;
      box-shadow: inset 0 2px 6px rgba(15,23,42,0.12);
    }

    .corridor-vertical .vertical-text {
      writing-mode: vertical-rl;
      transform: rotate(180deg);
      text-transform: uppercase;
      letter-spacing: 0.2em;
      font-size: 0.9rem;
      font-weight: 700;
      color: #1e293b;
    }

    .connector-row-left,
    .connector-row-right {
      display: grid;
      align-items: center;
      gap: 0;
    }

    .connector-row-left { grid-template-columns: 1fr 52px; }
    .connector-row-right { grid-template-columns: 52px 1fr; }

    .connector-left,
    .connector-right {
      height: 20px;
      background: var(--corridor);
    }

    .connector-left {
      border-top: 4px solid var(--wall);
      border-bottom: 4px solid var(--wall);
      border-left: 4px solid var(--wall);
      border-top-left-radius: 999px;
      border-bottom-left-radius: 999px;
    }

    .connector-right {
      border-top: 4px solid var(--wall);
      border-bottom: 4px solid var(--wall);
      border-right: 4px solid var(--wall);
      border-top-right-radius: 999px;
      border-bottom-right-radius: 999px;
    }

    .floor-room {
      position: relative;
      width: 100%;
      min-height: 165px;
      border: 4px solid var(--wall);
      background: rgba(255,255,255,0.96);
      text-align: left;
      padding: 16px;
      box-shadow: var(--shadow);
      overflow: visible;
    }

    .floor-room:hover {
      background: white;
      transform: scale(1.015);
    }

    .floor-room:active { transform: scale(0.985); }

    .room-outline {
      position: absolute;
      inset: 8px;
      border: 1px dashed #cbd5e1;
      border-radius: 20px;
      pointer-events: none;
    }

    .door-right, .door-left, .door-top, .door-bottom {
      position: absolute;
      background: var(--bg1);
    }

    .door-right {
      right: -2px;
      top: 50%;
      transform: translateY(-50%);
      width: 12px;
      height: 64px;
      border-top: 4px solid var(--wall);
      border-bottom: 4px solid var(--wall);
      border-left: 4px solid var(--wall);
      border-top-left-radius: 999px;
      border-bottom-left-radius: 999px;
    }

    .door-left {
      left: -2px;
      top: 50%;
      transform: translateY(-50%);
      width: 12px;
      height: 64px;
      border-top: 4px solid var(--wall);
      border-bottom: 4px solid var(--wall);
      border-right: 4px solid var(--wall);
      border-top-right-radius: 999px;
      border-bottom-right-radius: 999px;
    }

    .door-top {
      left: 50%;
      top: -2px;
      transform: translateX(-50%);
      width: 64px;
      height: 12px;
      border-left: 4px solid var(--wall);
      border-right: 4px solid var(--wall);
      border-bottom: 4px solid var(--wall);
      border-bottom-left-radius: 999px;
      border-bottom-right-radius: 999px;
    }

    .door-bottom {
      left: 50%;
      bottom: -2px;
      transform: translateX(-50%);
      width: 64px;
      height: 12px;
      border-left: 4px solid var(--wall);
      border-right: 4px solid var(--wall);
      border-top: 4px solid var(--wall);
      border-top-left-radius: 999px;
      border-top-right-radius: 999px;
    }

    .room-head {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
      position: relative;
      z-index: 1;
    }

    .room-meta {
      margin-top: 10px;
      font-size: 0.9rem;
      color: #475569;
      position: relative;
      z-index: 1;
    }

    .room-kicker {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.28em;
      color: var(--subtext);
    }

    .room-title {
      margin-top: 8px;
      font-size: 1rem;
      font-weight: 700;
      line-height: 1.35;
      word-break: break-word;
    }

    .room-icon {
      font-size: 1.1rem;
      opacity: 0.75;
      margin-top: 2px;
      flex-shrink: 0;
    }

    .shape-1 { border-top-left-radius: 48px; border-bottom-right-radius: 32px; border-top-right-radius: 20px; border-bottom-left-radius: 20px; }
    .shape-2 { border-top-left-radius: 28px; border-top-right-radius: 36px; border-bottom-left-radius: 32px; border-bottom-right-radius: 20px; }
    .shape-3 { border-top-right-radius: 48px; border-bottom-left-radius: 32px; border-top-left-radius: 20px; border-bottom-right-radius: 20px; }
    .shape-4 { border-bottom-left-radius: 48px; border-top-right-radius: 32px; border-top-left-radius: 20px; border-bottom-right-radius: 20px; }
    .shape-5 { border-radius: 28px; }
    .shape-6 { border-bottom-right-radius: 48px; border-top-left-radius: 32px; border-top-right-radius: 20px; border-bottom-left-radius: 20px; }

    .section-header-box {
      margin-bottom: 16px;
      border-radius: 32px;
      border: 4px solid var(--wall);
      background: white;
      padding: 16px;
      box-shadow: 0 4px 12px rgba(15,23,42,0.05);
    }

    .run-complete {
      margin-top: 24px;
      border-radius: 24px;
      border: 1px solid #cbd5e1;
      background: #0f172a;
      color: white;
      padding: 20px;
      box-shadow: 0 18px 36px rgba(15,23,42,0.22);
    }

    .run-complete-title {
      font-size: 1.25rem;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .run-complete-sub { color: #cbd5e1; }

    @media (max-width: 1100px) {
      .app-shell { grid-template-columns: 1fr; }
      .two-wing { grid-template-columns: 1fr; }
      .corridor-vertical { display: none; }
      .connector-row-left, .connector-row-right { grid-template-columns: 1fr; }
      .connector-left, .connector-right { display: none; }
    }

    @media (max-width: 700px) {
      body { padding: 12px; }
      .panel-body, .panel-header, .main-panel-header, .map-wrapper { padding-left: 16px; padding-right: 16px; }
      .button-row { grid-template-columns: 1fr; }
      .header-top { align-items: flex-start; }
    }
  </style>
</head>
<body>
  <div id="app"></div>

  <script>
    const CATEGORY_ITEMS = {
      Kitchen: ["plate", "bowl", "cup", "fork", "spoon", "knife", "pan", "pot", "kettle", "cutting board", "dish soap", "sponge"],
      Bedroom: ["pillow", "blanket", "hanger", "alarm clock", "lamp", "laundry basket", "bedsheet", "slippers", "mirror"],
      Bathroom: ["toothbrush", "toothpaste", "towel", "soap", "shampoo", "hair dryer", "toilet paper", "comb", "razor"],
      Cleaning: ["broom", "mop", "bucket", "vacuum cleaner", "spray bottle", "dustpan", "rubber gloves", "trash bag"],
      LivingRoom: ["remote control", "cushion", "candle", "vase", "extension cord", "battery", "flashlight", "tissue box"],
      Study: ["pen", "pencil", "eraser", "ruler", "scissors", "tape", "notebook", "marker"]
    };

    const SHOWROOM_SECTIONS = {
      Kitchen: {
        Cookware: ["pan", "pot", "kettle", "cutting board"],
        Tableware: ["plate", "bowl", "cup", "fork", "spoon", "knife"],
        Cleaning: ["dish soap", "sponge"]
      },
      Bedroom: {
        Bedding: ["pillow", "blanket", "bedsheet"],
        Storage: ["hanger", "laundry basket", "slippers"],
        Personal: ["alarm clock", "lamp", "mirror"]
      },
      Bathroom: {
        DentalCare: ["toothbrush", "toothpaste"],
        Bathing: ["towel", "soap", "shampoo"],
        Grooming: ["hair dryer", "toilet paper", "comb", "razor"]
      },
      Cleaning: {
        FloorCare: ["broom", "mop", "bucket", "vacuum cleaner"],
        Supplies: ["spray bottle", "dustpan", "rubber gloves", "trash bag"]
      },
      LivingRoom: {
        Comfort: ["cushion", "candle", "vase", "tissue box"],
        Devices: ["remote control", "extension cord", "battery", "flashlight"]
      },
      Study: {
        WritingTools: ["pen", "pencil", "marker"],
        DeskTools: ["eraser", "ruler", "scissors", "tape", "notebook"]
      }
    };

    const MUSEUMS = [
      { id: "random", shortLabel: "Museum A", name: "Museum A", labelMode: "item-list", organization: "random" },
      { id: "listed", shortLabel: "Museum B", name: "Museum B", labelMode: "item-list", organization: "structured" },
      { id: "structured", shortLabel: "Museum C", name: "Museum C", labelMode: "category", organization: "structured" }
    ];

    const ROOM_SHAPES = ["shape-1", "shape-2", "shape-3", "shape-4", "shape-5", "shape-6"];

    let activeMuseumId = MUSEUMS[0].id;
    let view = "museum";
    let selectedShowroomId = null;
    let selectedSectionId = null;
    let foundItems = [];
    let targets = [];
    let timeLeft = 120;
    let gameState = "idle";
    let timerId = null;

    function shuffle(array) {
      const arr = [...array];
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    function sample(array, count) {
      return shuffle(array).slice(0, count);
    }

    function titleCase(text) {
      return text.replace(/([A-Z])/g, " $1").trim().replace(/^./, m => m.toUpperCase());
    }

    function pluralizeItem(item) {
      const irregular = {
        toothbrush: "toothbrushes",
        flashlight: "flashlights",
        "tissue box": "tissue boxes",
        "dish soap": "dish soaps",
        toothpaste: "toothpastes",
        "toilet paper": "toilet papers",
        "hair dryer": "hair dryers",
        "laundry basket": "laundry baskets",
        "alarm clock": "alarm clocks",
        "cutting board": "cutting boards",
        "remote control": "remote controls",
        "extension cord": "extension cords",
        "spray bottle": "spray bottles",
        "vacuum cleaner": "vacuum cleaners",
        "rubber gloves": "rubber gloves",
        bedsheet: "bedsheets"
      };
      if (irregular[item]) return irregular[item];
      if (item.endsWith("y") && !/[aeiou]y$/.test(item)) return item.slice(0, -1) + "ies";
      if (/(s|x|z|ch|sh)$/.test(item)) return item + "es";
      return item + "s";
    }

    function chunk(array, size) {
      const chunks = [];
      for (let i = 0; i < array.length; i += size) chunks.push(array.slice(i, i + size));
      return chunks;
    }

    function buildStructuredMuseum(labelMode) {
      return Object.entries(SHOWROOM_SECTIONS).map(([showroomName, sections]) => {
        const sectionEntries = Object.entries(sections).map(([sectionName, items]) => ({
          id: `${showroomName}-${sectionName}`,
          name: labelMode === "category" ? titleCase(sectionName) : items.join(", "),
          trueName: titleCase(sectionName),
          items
        }));

        const showroomItems = sectionEntries.flatMap(section => section.items);

        return {
          id: showroomName,
          name: labelMode === "category" ? titleCase(showroomName) : showroomItems.join(", "),
          trueName: titleCase(showroomName),
          sections: sectionEntries
        };
      });
    }

    function buildRandomMuseum() {
      const allItems = Object.values(CATEGORY_ITEMS).flat();
      const shuffled = shuffle(allItems);
      const showroomChunks = chunk(shuffled, Math.ceil(shuffled.length / 6));

      return showroomChunks.map((itemsForShowroom, showroomIndex) => {
        const sectionChunks = chunk(itemsForShowroom, Math.max(2, Math.ceil(itemsForShowroom.length / 3)));
        return {
          id: `random-${showroomIndex}`,
          name: itemsForShowroom.join(", "),
          trueName: itemsForShowroom.join(", "),
          sections: sectionChunks.map((items, sectionIndex) => ({
            id: `random-${showroomIndex}-${sectionIndex}`,
            name: items.join(", "),
            trueName: items.join(", "),
            items
          }))
        };
      });
    }

    function buildMuseum(museum) {
      return museum.organization === "random" ? buildRandomMuseum() : buildStructuredMuseum(museum.labelMode);
    }

    function generateTargets() {
      return sample(Object.values(CATEGORY_ITEMS).flat(), 10);
    }

    function getActiveMuseum() {
      return MUSEUMS.find(m => m.id === activeMuseumId);
    }

    function getLayout() {
      return buildMuseum(getActiveMuseum());
    }

    function getSelectedShowroom(layout) {
      return layout.find(showroom => showroom.id === selectedShowroomId) || null;
    }

    function getSelectedSection(selectedShowroom) {
      return selectedShowroom?.sections.find(section => section.id === selectedSectionId) || null;
    }

    function resetForMuseumSwitch() {
      view = "museum";
      selectedShowroomId = null;
      selectedSectionId = null;
      foundItems = [];
      targets = generateTargets();
      timeLeft = 120;
      gameState = "idle";
      stopTimer();
    }

    function stopTimer() {
      if (timerId) {
        clearInterval(timerId);
        timerId = null;
      }
    }

    function startGame() {
      stopTimer();
      targets = generateTargets();
      foundItems = [];
      timeLeft = 120;
      gameState = "running";
      view = "museum";
      selectedShowroomId = null;
      selectedSectionId = null;
      timerId = setInterval(() => {
        timeLeft -= 1;
        if (timeLeft <= 0) {
          timeLeft = 0;
          gameState = "finished";
          stopTimer();
        }
        render();
      }, 1000);
      render();
    }

    function resetGame() {
      stopTimer();
      targets = generateTargets();
      foundItems = [];
      timeLeft = 120;
      gameState = "idle";
      view = "museum";
      selectedShowroomId = null;
      selectedSectionId = null;
      render();
    }

    function openShowroom(id) {
      selectedShowroomId = id;
      selectedSectionId = null;
      view = "showroom";
      render();
    }

    function openSection(id) {
      selectedSectionId = id;
      view = "section";
      render();
    }

    function goBack() {
      if (view === "section") {
        view = "showroom";
        selectedSectionId = null;
      } else if (view === "showroom") {
        view = "museum";
        selectedShowroomId = null;
      }
      render();
    }

    function goHome() {
      view = "museum";
      selectedShowroomId = null;
      selectedSectionId = null;
      render();
    }

    function handleItemClick(item) {
      if (gameState !== "running") return;
      if (targets.includes(item) && !foundItems.includes(item)) {
        foundItems.push(item);
        if (foundItems.length === targets.length) {
          gameState = "finished";
          stopTimer();
        }
        render();
      }
    }

    function progressPercent() {
      return Math.round((foundItems.length / targets.length) * 100);
    }

    function roomHTML({ title, subtitle, meta, icon, shapeClass, doorSide, dataAttrs = "", extraClass = "" }) {
      return `
        <button class="floor-room ${shapeClass} ${extraClass}" ${dataAttrs}>
          <div class="room-outline"></div>
          <div class="door-${doorSide}"></div>
          <div class="room-head">
            <div>
              <div class="room-kicker">${subtitle}</div>
              <div class="room-title">${escapeHTML(title)}</div>
            </div>
            <div class="room-icon">${icon}</div>
          </div>
          <div class="room-meta">${escapeHTML(meta)}</div>
        </button>
      `;
    }

    function renderMuseumView(layout) {
      const leftWing = layout.slice(0, 3);
      const rightWing = layout.slice(3, 6);

      return `
        <div class="blueprint">
          <div class="lobby">
            <div class="micro-label">Main lobby</div>
            <div class="section-title">Museum View</div>
            <div class="subtitle-text">Find the most efficient route to the correct household items.</div>
          </div>

          <div class="two-wing">
            <div class="wing">
              ${leftWing.map((showroom, index) => `
                <div class="connector-row-left">
                  ${roomHTML({
                    title: showroom.name,
                    subtitle: "Showroom",
                    meta: `${showroom.sections.length} sections`,
                    icon: "🏛️",
                    shapeClass: ROOM_SHAPES[index % ROOM_SHAPES.length],
                    doorSide: "right",
                    dataAttrs: `data-action="open-showroom" data-showroom-id="${showroom.id}"`
                  })}
                  <div class="connector-right"></div>
                </div>
              `).join("")}
            </div>

            <div class="corridor-vertical">
              <div class="micro-label">Central</div>
              <div class="vertical-text">Corridor</div>
              <div class="micro-label">Hall</div>
            </div>

            <div class="wing">
              ${rightWing.map((showroom, index) => `
                <div class="connector-row-right">
                  <div class="connector-left"></div>
                  ${roomHTML({
                    title: showroom.name,
                    subtitle: "Showroom",
                    meta: `${showroom.sections.length} sections`,
                    icon: "🏛️",
                    shapeClass: ROOM_SHAPES[(index + 3) % ROOM_SHAPES.length],
                    doorSide: "left",
                    dataAttrs: `data-action="open-showroom" data-showroom-id="${showroom.id}"`
                  })}
                </div>
              `).join("")}
            </div>
          </div>
        </div>
      `;
    }

    function renderShowroomView(selectedShowroom) {
      const sections = selectedShowroom.sections;
      const leftWing = sections.slice(0, Math.ceil(sections.length / 2));
      const rightWing = sections.slice(Math.ceil(sections.length / 2));

      return `
        <div class="blueprint simple-grid">
          <div class="section-header-box">
            <div class="micro-label">Current showroom</div>
            <div class="section-title">${escapeHTML(selectedShowroom.name)}</div>
          </div>

          <div class="two-wing">
            <div class="wing">
              ${leftWing.map((section, index) => `
                <div class="connector-row-left">
                  ${roomHTML({
                    title: section.name,
                    subtitle: "Section",
                    meta: `${section.items.length} item groups`,
                    icon: "🗺️",
                    shapeClass: ROOM_SHAPES[(index + 1) % ROOM_SHAPES.length],
                    doorSide: "right",
                    extraClass: "min-h-180",
                    dataAttrs: `data-action="open-section" data-section-id="${section.id}"`
                  })}
                  <div class="connector-right"></div>
                </div>
              `).join("")}
            </div>

            <div class="corridor-vertical">
              <div class="micro-label">Section</div>
              <div class="vertical-text">Corridor</div>
              <div class="micro-label">Path</div>
            </div>

            <div class="wing">
              ${rightWing.map((section, index) => `
                <div class="connector-row-right">
                  <div class="connector-left"></div>
                  ${roomHTML({
                    title: section.name,
                    subtitle: "Section",
                    meta: `${section.items.length} item groups`,
                    icon: "🗺️",
                    shapeClass: ROOM_SHAPES[(index + 3) % ROOM_SHAPES.length],
                    doorSide: "left",
                    dataAttrs: `data-action="open-section" data-section-id="${section.id}"`
                  })}
                </div>
              `).join("")}
            </div>
          </div>
        </div>
      `;
    }

    function renderSectionView(selectedSection) {
      const pluralItems = selectedSection.items.map(item => pluralizeItem(item));
      const midpoint = Math.ceil(pluralItems.length / 2);
      const leftWing = pluralItems.slice(0, midpoint);
      const rightWing = pluralItems.slice(midpoint);

      return `
        <div class="blueprint simple-grid">
          <div class="section-header-box">
            <div class="micro-label">Current section</div>
            <div class="section-title">${escapeHTML(selectedSection.name)}</div>
          </div>

          <div class="two-wing">
            <div class="wing">
              ${leftWing.map((label, index) => {
                const singularItem = selectedSection.items[index];
                const isTarget = targets.includes(singularItem);
                const isFound = foundItems.includes(singularItem);
                return `
                  <div class="connector-row-left">
                    <button class="floor-room shape-5" data-action="pick-item" data-item="${escapeAttr(singularItem)}" style="min-height:92px;border-radius:28px;background:rgba(255,255,255,0.9);box-shadow:var(--shadow-strong);">
                      <div class="room-head">
                        <div class="room-title">${escapeHTML(label)}</div>
                        <div class="badge-list">
                          ${isTarget ? `<span class="badge">Target</span>` : ""}
                          ${isFound ? `<span class="badge dark">Found</span>` : ""}
                        </div>
                      </div>
                    </button>
                    <div class="connector-right"></div>
                  </div>
                `;
              }).join("")}
            </div>

            <div class="corridor-vertical">
              <div class="micro-label">Exhibit</div>
              <div class="vertical-text">Corridor</div>
              <div class="micro-label">Route</div>
            </div>

            <div class="wing">
              ${rightWing.map((label, offset) => {
                const itemIndex = midpoint + offset;
                const singularItem = selectedSection.items[itemIndex];
                const isTarget = targets.includes(singularItem);
                const isFound = foundItems.includes(singularItem);
                return `
                  <div class="connector-row-right">
                    <div class="connector-left"></div>
                    <button class="floor-room shape-5" data-action="pick-item" data-item="${escapeAttr(singularItem)}" style="min-height:92px;border-radius:28px;background:rgba(255,255,255,0.9);box-shadow:var(--shadow-strong);">
                      <div class="room-head">
                        <div class="room-title">${escapeHTML(label)}</div>
                        <div class="badge-list">
                          ${isTarget ? `<span class="badge">Target</span>` : ""}
                          ${isFound ? `<span class="badge dark">Found</span>` : ""}
                        </div>
                      </div>
                    </button>
                  </div>
                `;
              }).join("")}
            </div>
          </div>
        </div>
      `;
    }

    function renderSidebar() {
      return `
        <div class="panel-header">
          <h1 class="title">Museum Search Challenge</h1>
        </div>
        <div class="panel-body">
          <div class="info-box">
            <div class="info-label">🔎 Target items</div>
            <div class="badge-list">
              ${targets.map(item => `<span class="badge ${foundItems.includes(item) ? "found" : ""}">${escapeHTML(item)}</span>`).join("")}
            </div>
          </div>

          <div class="info-box">
            <div class="progress-meta">
              <div class="info-label" style="margin:0">⏱️ Time left</div>
              <div class="timer-value">${formatTime(timeLeft)}</div>
            </div>
            <div class="progress-bar"><div class="progress-fill" style="width:${(timeLeft / 120) * 100}%"></div></div>
          </div>

          <div class="info-box">
            <div class="info-label">📈 Progress</div>
            <div class="progress-meta">
              <span>${foundItems.length} / ${targets.length} found</span>
              <span>${progressPercent()}%</span>
            </div>
            <div class="progress-bar"><div class="progress-fill" style="width:${progressPercent()}%"></div></div>
          </div>

          <div class="button-row">
            <button class="btn btn-primary" data-action="start-game">${gameState === "running" ? "Restart Run" : "Start 2-Minute Run"}</button>
            <button class="btn btn-secondary" data-action="reset-game">↻ Reset</button>
          </div>
        </div>
      `;
    }

    function renderMain() {
      const activeMuseum = getActiveMuseum();
      const layout = getLayout();
      const selectedShowroom = getSelectedShowroom(layout);
      const selectedSection = getSelectedSection(selectedShowroom);

      let mapContent = "";
      if (view === "museum") mapContent = renderMuseumView(layout);
      if (view === "showroom" && selectedShowroom) mapContent = renderShowroomView(selectedShowroom);
      if (view === "section" && selectedSection) mapContent = renderSectionView(selectedSection);

      return `
        <div class="main-panel-header">
          <div class="header-top">
            <h2 class="title" style="margin:0">${activeMuseum.name}</h2>
            <div class="top-actions">
              <button class="pill-btn" data-action="go-back" ${view === "museum" ? "disabled" : ""}>← Back</button>
              <button class="pill-btn" data-action="go-home" ${view === "museum" ? "disabled" : ""}>⌂ Top Level</button>
            </div>
          </div>

          <div class="museum-tabs">
            ${MUSEUMS.map(museum => `
              <button class="pill-btn ${museum.id === activeMuseumId ? "active" : ""}" data-action="switch-museum" data-museum-id="${museum.id}">${museum.shortLabel}</button>
            `).join("")}
          </div>

          <div class="view-badges" style="margin-top:12px;">
            <span class="badge ${view === "museum" ? "dark" : ""}">1. Museum view</span>
            <span class="badge ${view === "showroom" ? "dark" : ""}">2. Showroom view</span>
            <span class="badge ${view === "section" ? "dark" : ""}">3. Section view</span>
            <span class="badge ${gameState === "running" ? "dark" : ""}">Status: ${gameState}</span>
          </div>
        </div>

        <div class="map-wrapper">
          ${mapContent}
          ${gameState === "finished" ? `
            <div class="run-complete">
              <div class="run-complete-title">Run complete</div>
              <div class="run-complete-sub">You found ${foundItems.length} out of ${targets.length} target items in ${activeMuseum.name}.</div>
            </div>
          ` : ""}
        </div>
      `;
    }

    function formatTime(totalSeconds) {
      const minutes = Math.floor(totalSeconds / 60);
      const seconds = String(totalSeconds % 60).padStart(2, "0");
      return `${minutes}:${seconds}`;
    }

    function escapeHTML(str) {
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/\"/g, "&quot;")
        .replace(/'/g, "&#39;");
    }

    function escapeAttr(str) {
      return escapeHTML(str);
    }

    function attachEvents() {
      document.querySelectorAll('[data-action="start-game"]').forEach(btn => {
        btn.addEventListener('click', startGame);
      });

      document.querySelectorAll('[data-action="reset-game"]').forEach(btn => {
        btn.addEventListener('click', resetGame);
      });

      document.querySelectorAll('[data-action="go-back"]').forEach(btn => {
        btn.addEventListener('click', () => { if (!btn.disabled) goBack(); });
      });

      document.querySelectorAll('[data-action="go-home"]').forEach(btn => {
        btn.addEventListener('click', () => { if (!btn.disabled) goHome(); });
      });

      document.querySelectorAll('[data-action="switch-museum"]').forEach(btn => {
        btn.addEventListener('click', () => {
          activeMuseumId = btn.dataset.museumId;
          resetForMuseumSwitch();
          render();
        });
      });

      document.querySelectorAll('[data-action="open-showroom"]').forEach(btn => {
        btn.addEventListener('click', () => openShowroom(btn.dataset.showroomId));
      });

      document.querySelectorAll('[data-action="open-section"]').forEach(btn => {
        btn.addEventListener('click', () => openSection(btn.dataset.sectionId));
      });

      document.querySelectorAll('[data-action="pick-item"]').forEach(btn => {
        btn.addEventListener('click', () => handleItemClick(btn.dataset.item));
      });
    }

    function render() {
      const app = document.getElementById('app');
      app.innerHTML = `
        <div class="app-shell">
          <aside class="panel">${renderSidebar()}</aside>
          <main class="panel">${renderMain()}</main>
        </div>
      `;
      attachEvents();
    }

    targets = generateTargets();
    render();
  </script>
</body>
</html>
